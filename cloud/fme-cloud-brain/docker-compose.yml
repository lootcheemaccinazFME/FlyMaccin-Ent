services:
  brain:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MODEL_BASE_URL: http://model:8000/v1
    ports:
      - "8080:8080"
    volumes:
      - fme_data:/data
    depends_on:
      model:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 20s
      timeout: 6s
      retries: 5
      start_period: 15s

  model:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    restart: unless-stopped
    gpus: all
    ipc: host
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    command:
      - --model
      - ${MODEL_ID:?Set MODEL_ID in .env}
      - --served-model-name
      - ${MODEL_NAME:-fme-local}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${MODEL_API_KEY:-local}

volumes:
  fme_data:
  hf_cache:
