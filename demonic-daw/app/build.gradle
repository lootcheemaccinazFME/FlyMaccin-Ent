plugins { id 'com.android.application' }

android {
 namespace 'com.flymaccin.demonicdaw'
 compileSdk 36
 defaultConfig {
   applicationId 'com.flymaccin.demonicdaw'
   minSdk 26
   targetSdk 36
   versionCode 2
   versionName '1.1.0-native-audio'
   externalNativeBuild {
     cmake { cppFlags '-std=c++17 -O3 -ffast-math' }
   }
   ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
 }
 buildFeatures { prefab true }
 externalNativeBuild {
   cmake {
     path file('src/main/cpp/CMakeLists.txt')
     version '3.22.1'
   }
 }
 packagingOptions {
   jniLibs { useLegacyPackaging false }
 }
}

dependencies {
 implementation 'com.google.oboe:oboe:1.10.0'
 implementation 'net.volcanomobile.fluidsynth-android:fluidsynth-android:2.4.6'
}
