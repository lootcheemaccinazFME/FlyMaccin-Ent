plugins { id 'com.android.application' }

def releaseKeystorePath = System.getenv('DEMONIC_KEYSTORE_PATH')

android {
 namespace 'com.flymaccin.demonicdaw'
 compileSdk 36
 ndkVersion '27.2.12479018'
 defaultConfig {
   applicationId 'com.flymaccin.demonicdaw'
   minSdk 26
   targetSdk 36
   versionCode 2
   versionName '1.1.0-native-audio'
   externalNativeBuild {
     cmake {
       cppFlags '-std=c++17 -O3 -ffast-math'
       arguments '-DANDROID_STL=c++_shared'
     }
   }
   ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
 }
 signingConfigs {
   release {
     if (releaseKeystorePath) {
       storeFile file(releaseKeystorePath)
       storePassword System.getenv('DEMONIC_KEYSTORE_PASSWORD')
       keyAlias System.getenv('DEMONIC_KEY_ALIAS')
       keyPassword System.getenv('DEMONIC_KEY_PASSWORD')
     }
   }
 }
 buildTypes {
   release {
     if (releaseKeystorePath) signingConfig signingConfigs.release
     minifyEnabled false
     shrinkResources false
   }
 }
 buildFeatures { prefab true }
 externalNativeBuild {
   cmake {
     path file('src/main/cpp/CMakeLists.txt')
     version '3.22.1'
   }
 }
 packagingOptions {
   jniLibs { useLegacyPackaging false }
 }
}

dependencies {
 implementation 'com.google.oboe:oboe:1.10.0'
 implementation 'net.volcanomobile.fluidsynth-android:fluidsynth-android:2.4.6'
 implementation 'androidx.documentfile:documentfile:1.0.1'
}
