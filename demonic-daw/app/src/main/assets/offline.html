<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Demonic DAW Offline</title>
<style>
:root{--bg:#050507;--panel:#0d0b12;--purple:#5126a8;--green:#6dff7b;--blue:#3155ff;--orange:#ff8b2b;--text:#f5f2ff;--muted:#9a95ab;--line:#262132}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh}header{padding:14px 14px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#100c19,#07070b);position:sticky;top:0;z-index:4}.k{font:700 9px monospace;letter-spacing:.15em;color:var(--green)}h1{font-size:21px;margin:3px 0}.net{display:inline-flex;gap:7px;align-items:center;font:700 10px monospace;color:var(--orange)}.dot{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 10px var(--orange)}.transport,.tabs,.kits{display:flex;gap:7px;align-items:center;padding:10px 12px;overflow:auto;border-bottom:1px solid var(--line)}button{border:1px solid #3d3450;background:#12101a;color:var(--text);border-radius:8px;padding:10px 12px;font-weight:700;white-space:nowrap}.primary{background:var(--green);color:#071009;border-color:var(--green)}.secondary{border-color:var(--blue);color:#b8c4ff}.active{border-color:var(--green);box-shadow:inset 3px 0 var(--orange)}.read{font:700 11px monospace;color:var(--green);min-width:56px}.screen{padding:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line)}.head small{display:block;color:var(--green);font:700 9px monospace}.head b{font:700 10px monospace;color:var(--blue)}.grid{display:grid;grid-template-columns:62px repeat(16,minmax(23px,1fr));gap:3px;padding:10px;overflow:auto}.label{font:700 9px monospace;color:#c8c2d3;display:flex;align-items:center}.step{height:26px;padding:0;border-radius:4px;background:#17131d;border-color:#2a2232}.step.on{background:var(--orange);border-color:#ffad69;box-shadow:0 0 8px rgba(255,139,43,.35)}.step.play{outline:2px solid var(--green)}.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;padding:12px}.preset{text-align:left;min-height:52px}.preset span{display:block;color:var(--muted);font:8px monospace;margin-top:4px}.status{position:sticky;bottom:0;padding:9px 12px;background:#07070b;border-top:1px solid var(--line);font:700 9px monospace;color:var(--muted);display:flex;gap:10px;justify-content:space-between}.hidden{display:none}.save{color:var(--green)}input[type=range]{width:130px;accent-color:var(--green)}@media(min-width:700px){body{max-width:900px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style></head><body>
<header><div class="k">FME CREATIVE PRODUCTION ENGINE</div><h1>Demonic DAW</h1><div class="net"><i class="dot"></i> OFFLINE STUDIO · LOCAL ENGINE</div></header>
<div class="transport"><button id="play" class="primary">▶ PLAY</button><div class="read"><span id="bpmText">92</span> BPM</div><input id="bpm" type="range" min="60" max="180" value="92"><button id="save">SAVE</button><button id="online" class="secondary">GO ONLINE</button></div>
<div class="tabs"><button data-tab="drums" class="active">DRUMS</button><button data-tab="bass">BASS</button><button data-tab="sounds">SOUNDS</button></div>
<div id="drums" class="screen"><div class="panel"><div class="head"><div><small>BEAT ENGINE</small><strong>Drums 1</strong></div><b id="kitName">BAY KNOCK</b></div><div class="grid" id="drumGrid"></div><div class="kits" id="kits"></div></div></div>
<div id="bass" class="screen hidden"><div class="panel"><div class="head"><div><small>PIANO ROLL</small><strong>Bass 1</strong></div><b id="soundName">G-FUNK BASS</b></div><div class="grid" id="bassGrid"></div></div></div>
<div id="sounds" class="screen hidden"><div class="panel"><div class="head"><div><small>FME INSTRUMENT LIBRARY</small><strong>Offline Sounds</strong></div><b>LOCAL</b></div><div class="presets" id="presets"></div></div></div>
<div class="status"><span id="engine">ENGINE READY</span><span class="save">LOCAL AUTOSAVE ACTIVE</span><span>ONLINE FEATURES RETURN WHEN CONNECTED</span></div>
<script>
const D=['Kick','Snare','Hat','Clap','Tom','Perc','Rim','Crash']; const N=['E3','D#3','D3','C#3','C3','B2','A#2','A2','G#2','G2','F#2','F2'];
const P=[['Grand Piano','triangle',4200],['Rhodes','sine',2600],['Gospel Keys','triangle',3600],['Jazz Keys','sine',3000],['Warm Organ','square',1800],['Electric Guitar','sawtooth',2800],['Acoustic Guitar','triangle',5200],['Funk Guitar','square',3900],['Rock / Blues Lead','sawtooth',3200],['Electric Bass','triangle',1250],['Synth Bass','sawtooth',900],['G-Funk Bass','square',1050],['808 Sub','sine',650],['Walking Bass','triangle',1450],['Slap Bass','sawtooth',2100],['Trumpet','sawtooth',4200],['Sax','square',2600],['Trombone','sawtooth',1900],['Brass Stack','sawtooth',3500],['Strings','sawtooth',2400],['Demonic Synth','sawtooth',2400],['Percussion FX','square',5000]];
const kits=['Bay Knock','808 Pressure','Funk Pocket','Circus Percussion'];
const load=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}, store=()=>{localStorage.setItem('off-drums',JSON.stringify(drums));localStorage.setItem('off-bass',JSON.stringify(bass));localStorage.setItem('off-sound',sound);localStorage.setItem('off-kit',kit);localStorage.setItem('off-bpm',bpm.value)};
let drums=load('off-drums',D.map((_,r)=>Array.from({length:16},(_,s)=>r===0?[0,4,8,12].includes(s):r===1?[4,12].includes(s):r===2?s%2===0:r===3?[6,14].includes(s):false));
let bass=load('off-bass',N.map((_,r)=>Array.from({length:16},(_,s)=>r===7&&s%2===0))); let sound=load('off-sound','G-Funk Bass'),kit=load('off-kit','Bay Knock'); bpm.value=load('off-bpm',92); bpmText.textContent=bpm.value;
let ctx=null,timer=null,step=0,playing=false; function audio(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended')ctx.resume(); return ctx}
function hit(r){let c=audio(),o=c.createOscillator(),g=c.createGain(),f=[72,180,5400,900,220,1200,760,3200][r];o.type=r===0?'sine':(r===2||r===7?'square':'triangle');o.frequency.value=f;if(r===0)o.frequency.exponentialRampToValueAtTime(42,c.currentTime+.12);g.gain.value=r===2?.035:.12;g.gain.exponentialRampToValueAtTime(.001,c.currentTime+(r===2?.04:.16));o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.18)}
function tone(r){let c=audio(),p=P.find(x=>x[0]===sound)||P[10],o=c.createOscillator(),f=c.createBiquadFilter(),g=c.createGain(),m=64-r,h=440*Math.pow(2,(m-69)/12);o.type=p[1];o.frequency.value=h;f.type='lowpass';f.frequency.value=p[2];g.gain.value=.085;g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);o.connect(f).connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.24)}
function render(){drumGrid.innerHTML='';D.forEach((n,r)=>{let l=document.createElement('div');l.className='label';l.textContent=n;drumGrid.append(l);drums[r].forEach((v,s)=>{let b=document.createElement('button');b.className='step '+(v?'on ':'')+(s===step?'play':'');b.onclick=()=>{drums[r][s]=!drums[r][s];store();render()};drumGrid.append(b)})});bassGrid.innerHTML='';N.forEach((n,r)=>{let l=document.createElement('div');l.className='label';l.textContent=n;bassGrid.append(l);bass[r].forEach((v,s)=>{let b=document.createElement('button');b.className='step '+(v?'on ':'')+(s===step?'play':'');b.onclick=()=>{bass[r][s]=!bass[r][s];store();render()};bassGrid.append(b)})});soundName.textContent=sound.toUpperCase();kitName.textContent=kit.toUpperCase()}
function tick(){step=(step+1)%16;drums.forEach((r,i)=>r[step]&&hit(i));bass.forEach((r,i)=>r[step]&&tone(i));render()}
play.onclick=()=>{playing=!playing;play.textContent=playing?'Ⅱ PAUSE':'▶ PLAY';engine.textContent=playing?'ENGINE RUNNING':'ENGINE READY';if(timer)clearInterval(timer);if(playing)timer=setInterval(tick,(60000/+bpm.value)/4)};bpm.oninput=()=>{bpmText.textContent=bpm.value;store();if(playing){clearInterval(timer);timer=setInterval(tick,(60000/+bpm.value)/4)}};save.onclick=()=>{store();save.textContent='SAVED';setTimeout(()=>save.textContent='SAVE',900)};online.onclick=()=>location.href='https://demonicaistudiohut.floot.app';
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden')});
kits.forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>{kit=k;store();render()};document.getElementById('kits').append(b)});P.forEach(p=>{let b=document.createElement('button');b.className='preset '+(p[0]===sound?'active':'');b.innerHTML='<strong>'+p[0]+'</strong><span>'+p[1].toUpperCase()+' · '+p[2]+' Hz</span>';b.onclick=()=>{sound=p[0];store();tone(7);document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()};presets.append(b)});render();
window.addEventListener('beforeunload',store);
</script></body></html>
