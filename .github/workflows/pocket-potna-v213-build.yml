name: Pocket Potna v2.1.14 Emulator + Canonical FME Release

on:
  workflow_dispatch:
  push:
    branches:
      - build/pocket-potna-v2.1.14-fme-visual

jobs:
  emulator-debug:
    name: Functional Android Emulator (NON-RELEASE)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36 and emulator image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      - name: Fetch verified Pocket Potna v2.1.13 base source
        run: |
          curl --fail --location --retry 3 "https://fme-android-compiler.floot.app/_cdn/static/80744c91-9e6f-4f4d-be8b-eedac233be9c-Pocket_Potna_v2.1.13_CHATGPT_GATEWAY_SOURCE.zip" --output pocket-potna-base.zip
          mkdir pocket-potna-v2.1.14
          unzip -q pocket-potna-base.zip -d pocket-potna-v2.1.14

      - name: Apply v2.1.14 branding and release policy
        run: python scripts/prepare_pocket_potna_v214_release.py

      - name: Build NON-RELEASE debug APK for emulator validation
        working-directory: pocket-potna-v2.1.14
        env:
          GOOGLE_WEB_CLIENT_ID: ci-emulator-non-release.apps.googleusercontent.com
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ../out/emulator
          sha256sum app/build/outputs/apk/debug/app-debug.apk > ../out/emulator/DEBUG_APK_SHA256.txt
          printf '%s\n' \
            'artifact_class=DEBUG_TEST_NON_RELEASE' \
            'purpose=functional_android_emulator_validation' \
            'production_signing=NOT_CLAIMED' \
            > ../out/emulator/DEBUG_BUILD_CLASSIFICATION.txt

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Prepare emulator evidence directory
        run: |
          mkdir -p out/emulator
          printf '%s\n' \
            'avd_name=fme-pocket-potna-api36' \
            'api_level=36' \
            'target=google_apis' \
            'arch=x86_64' \
            'profile=pixel_7' \
            'apk=Pocket Potna v2.1.14 NON-RELEASE debug validation build' \
            > out/emulator/emulator-config.txt

      - name: Boot functional API 36 emulator and smoke-test debug build
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          avd-name: fme-pocket-potna-api36
          cores: 2
          ram-size: 4096
          heap-size: 512
          disk-size: 8G
          emulator-boot-timeout: 900
          disable-animations: true
          enable-hw-keyboard: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/emulator_smoke_test_v214.sh pocket-potna-v2.1.14 com.flymaccin.pocketpotna out/emulator pocket-potna-v2.1.14/app/build/outputs/apk/debug/app-debug.apk "NON-RELEASE debug validation"

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Potna-v2.1.14-Functional-Emulator-Evidence
          path: out/emulator/*
          if-no-files-found: warn

      - name: Upload NON-RELEASE debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Potna-v2.1.14-NON-RELEASE-Emulator-Debug
          path: pocket-potna-v2.1.14/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Canonical FME Release (UMD-030)
    needs: emulator-debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      EXPECTED_FME_SIGNER_SHA256: 93bcafc7947054445eea0bb54492a9067996b100648d0136a838c2e1a310adbb
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Fetch verified Pocket Potna v2.1.13 base source
        run: |
          curl --fail --location --retry 3 "https://fme-android-compiler.floot.app/_cdn/static/80744c91-9e6f-4f4d-be8b-eedac233be9c-Pocket_Potna_v2.1.13_CHATGPT_GATEWAY_SOURCE.zip" --output pocket-potna-base.zip
          mkdir pocket-potna-v2.1.14
          unzip -q pocket-potna-base.zip -d pocket-potna-v2.1.14

      - name: Apply v2.1.14 branding and UMD-030 release law
        run: python scripts/prepare_pocket_potna_v214_release.py

      - name: Validate protected production secrets
        env:
          FME_RELEASE_KEYSTORE_BASE64: ${{ secrets.FME_RELEASE_KEYSTORE_BASE64 }}
          FME_KEYSTORE_PASSWORD: ${{ secrets.FME_KEYSTORE_PASSWORD }}
          FME_KEY_ALIAS: ${{ secrets.FME_KEY_ALIAS }}
          FME_KEY_PASSWORD: ${{ secrets.FME_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -euo pipefail
          for v in FME_RELEASE_KEYSTORE_BASE64 FME_KEYSTORE_PASSWORD FME_KEY_ALIAS FME_KEY_PASSWORD GOOGLE_WEB_CLIENT_ID; do
            if [[ -z "${!v:-}" ]]; then
              echo "UMD-030 BLOCKED: missing protected secret $v"
              exit 1
            fi
          done
          printf '%s' "$FME_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fme-release.jks"
          chmod 600 "$RUNNER_TEMP/fme-release.jks"
          test -s "$RUNNER_TEMP/fme-release.jks"

      - name: Validate canonical keystore certificate
        env:
          FME_KEYSTORE_PASSWORD: ${{ secrets.FME_KEYSTORE_PASSWORD }}
          FME_KEY_ALIAS: ${{ secrets.FME_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ACTUAL=$(keytool -list -v -keystore "$RUNNER_TEMP/fme-release.jks" -storepass "$FME_KEYSTORE_PASSWORD" -alias "$FME_KEY_ALIAS" 2>/dev/null | sed -n 's/^SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -1)
          test -n "$ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED_FME_SIGNER_SHA256" ]]; then
            echo "UMD-030 BLOCKED: signer fingerprint mismatch"
            exit 1
          fi

      - name: Lint test and build signed APK AAB
        working-directory: pocket-potna-v2.1.14
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          FME_KEYSTORE_PATH: ${{ runner.temp }}/fme-release.jks
          FME_KEYSTORE_PASSWORD: ${{ secrets.FME_KEYSTORE_PASSWORD }}
          FME_KEY_ALIAS: ${{ secrets.FME_KEY_ALIAS }}
          FME_KEY_PASSWORD: ${{ secrets.FME_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:lintRelease :app:testReleaseUnitTest :app:assembleRelease :app:bundleRelease

      - name: Verify package signer alignment and archives
        run: |
          set -euo pipefail
          SRC="pocket-potna-v2.1.14"
          APK="$SRC/app/build/outputs/apk/release/app-release.apk"
          AAB="$SRC/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -1)
          echo "$BADGING" | grep -q "name='com.flymaccin.pocketpotna'"
          echo "$BADGING" | grep -q "versionCode='224'"
          echo "$BADGING" | grep -q "versionName='2.1.14'"
          ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | head -1)
          test "$ACTUAL" = "$EXPECTED_FME_SIGNER_SHA256"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "$APK"
          unzip -tq "$APK"
          unzip -tq "$AAB"
          chmod +x "$SRC/scripts/verify-16kb-native.sh"
          "$SRC/scripts/verify-16kb-native.sh" "$APK"

      - name: Collect canonical release receipts
        run: |
          set -euo pipefail
          SRC="pocket-potna-v2.1.14"
          mkdir -p out
          cp "$SRC/app/build/outputs/apk/release/app-release.apk" out/Pocket_Potna_v2.1.14_FME_CANONICAL_RELEASE.apk
          cp "$SRC/app/build/outputs/bundle/release/app-release.aab" out/Pocket_Potna_v2.1.14_FME_CANONICAL_RELEASE.aab
          cp "$SRC/V2_1_14_CANONICAL_RELEASE_AUDIT.md" out/
          sha256sum out/*.apk out/*.aab > out/SHA256SUMS.txt
          printf '%s\n' \
            'release_status=PASS' \
            'package=com.flymaccin.pocketpotna' \
            'versionName=2.1.14' \
            'versionCode=224' \
            "signer_sha256=$EXPECTED_FME_SIGNER_SHA256" \
            'functional_emulator_debug_lane=PASS' \
            > out/RELEASE_ACCEPTANCE.txt

      - name: Upload canonical release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Potna-v2.1.14-FME-Canonical-Release
          path: out/*
          if-no-files-found: error
