name: LOOTCHEE ROM Emulator CI

"on":
  push:
    branches:
      - build/lootchee-rom-emulator-v1
  workflow_dispatch:

concurrency:
  group: lootchee-rom-emulator-${{ github.ref }}
  cancel-in-progress: true

# PR #8 uses the branch push run as its single CI source to avoid duplicate builds.
# workflow_dispatch remains available for explicit retries.
# pull_request path filtering was intentionally removed.
# 
# Paths:
#
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/lootchee-rom-emulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            rm -rf "$ANDROID_HOME/ndk/27.0.12077973" "$ANDROID_HOME/.temp" || true
            set +o pipefail
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            set -o pipefail
            if "$SDKMANAGER" "ndk;27.0.12077973" "platforms;android-36"; then
              exit 0
            fi
            echo "Android SDK install attempt $attempt failed; retrying after cleanup"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Fetch libretro cores
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          cores="sameboy fceumm mgba bsnes gearsystem clownmdemu pcsx_rearmed mupen64plus_next_gles3 melondsds ppsspp flycast mednafen_pce_fast stella handy geolith play"
          for core in $cores; do
            for abi in arm64-v8a x86_64; do
              zip="/tmp/${core}-${abi}.zip"
              url="https://buildbot.libretro.com/nightly/android/latest/${abi}/${core}_libretro_android.so.zip"
              echo "Fetching ${core} for ${abi}"
              curl --fail --location --retry 3 "$url" --output "$zip"
              unzip -p "$zip" "${core}_libretro_android.so" > "app/src/main/jniLibs/${abi}/lib${core}_libretro_android.so"
              test -s "app/src/main/jniLibs/${abi}/lib${core}_libretro_android.so"
            done
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK payload
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/liblootchee_frontend.so"
          unzip -l "$APK" | grep "lib/x86_64/liblootchee_frontend.so"
          for core in sameboy fceumm mgba bsnes gearsystem clownmdemu pcsx_rearmed mupen64plus_next_gles3 melondsds ppsspp flycast mednafen_pce_fast stella handy geolith play; do
            unzip -l "$APK" | grep "lib/arm64-v8a/lib${core}_libretro_android.so"
          done
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" | grep "package: name='com.flymaccin.lootcheerom'"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lootchee-rom-emulator-debug
          path: android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk

  device-smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: lootchee-rom-emulator-debug
          path: /tmp/apk
      - name: Boot and prove first emulated frame
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -cores 2 -memory 4096
          script: |
            set -eux
            adb install --no-streaming -r /tmp/apk/app-debug.apk
            adb logcat -c
            echo "=== Installed x86_64 native libraries ==="
            adb shell pm path com.flymaccin.lootcheerom
            adb shell dumpsys package com.flymaccin.lootcheerom | grep -E "primaryCpuAbi|nativeLibraryDir" || true
            adb shell am force-stop com.flymaccin.lootcheerom
            adb shell am start -W -n com.flymaccin.lootcheerom/.MainActivity --ez autoTest true

            for i in $(seq 1 45); do
              marker="$(adb shell run-as com.flymaccin.lootcheerom cat files/boot.ok 2>/dev/null || true)"
              if echo "$marker" | grep -q "sameboy 160x144"; then
                echo "LOOTCHEE emulator smoke passed: $marker"
                exit 0
              fi
              if ! adb shell pidof com.flymaccin.lootcheerom >/dev/null 2>&1; then
                echo "LOOTCHEE emulator process exited before first frame"
                break
              fi
              sleep 1
            done

            echo "=== LOOTCHEE staged smoke markers ==="
            adb shell run-as com.flymaccin.lootcheerom sh -c 'for f in files/smoke.core files/smoke.stage files/boot.ok; do echo "--- $f"; cat "$f" 2>/dev/null || echo MISSING; done' || true
            echo "=== LOOTCHEE app files ==="
            adb shell run-as com.flymaccin.lootcheerom ls -la files 2>&1 || true
            echo "=== Loaded SameBoy mapping ==="
            pid="$(adb shell pidof com.flymaccin.lootcheerom | tr -d '\r' || true)"
            if [ -n "$pid" ]; then adb shell run-as com.flymaccin.lootcheerom cat "/proc/$pid/maps" | grep -i sameboy || true; fi
            echo "=== LOOTCHEE process ==="
            adb shell ps -A | grep com.flymaccin.lootcheerom || true
            echo "=== LOOTCHEE activity ==="
            adb shell dumpsys activity activities | grep -A 20 -B 5 com.flymaccin.lootcheerom || true
            echo "=== LOOTCHEE logcat ==="
            adb logcat -d | grep -E -i "LOOTCHEE-NATIVE|lootcheerom|sameboy|libretro|AndroidRuntime|FATAL EXCEPTION|UnsatisfiedLinkError|Fatal signal" || true
            exit 1
