name: LOOTCHEE ROM Emulator CI

"on":
  push:
    branches:
      - build/lootchee-rom-emulator-v1
  pull_request:
    paths:
      - android/lootchee-rom-emulator/**
      - .github/workflows/lootchee-rom-emulator.yml

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/lootchee-rom-emulator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "platforms;android-36"

      - name: Fetch libretro cores
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          cores="sameboy fceumm mgba bsnes gearsystem clownmdemu pcsx_rearmed mupen64plus_next_gles3 melondsds ppsspp flycast mednafen_pce_fast stella handy geolith play"
          for core in $cores; do
            for abi in arm64-v8a x86_64; do
              zip="/tmp/${core}-${abi}.zip"
              url="https://buildbot.libretro.com/nightly/android/latest/${abi}/${core}_libretro_android.so.zip"
              echo "Fetching ${core} for ${abi}"
              curl --fail --location --retry 3 "$url" --output "$zip"
              unzip -p "$zip" "${core}_libretro_android.so" > "app/src/main/jniLibs/${abi}/lib${core}_libretro_android.so"
              test -s "app/src/main/jniLibs/${abi}/lib${core}_libretro_android.so"
            done
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK payload
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep "lib/arm64-v8a/liblootchee_frontend.so"
          unzip -l "$APK" | grep "lib/x86_64/liblootchee_frontend.so"
          for core in sameboy fceumm mgba bsnes gearsystem clownmdemu pcsx_rearmed mupen64plus_next_gles3 melondsds ppsspp flycast mednafen_pce_fast stella handy geolith play; do
            unzip -l "$APK" | grep "lib/arm64-v8a/lib${core}_libretro_android.so"
          done
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging "$APK" | grep "package: name='com.flymaccin.lootcheerom'"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lootchee-rom-emulator-debug
          path: android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk
