name: LOOTCHEE ROM Emulator CI
on:
  push:
    branches: [ "build/lootchee-rom-emulator-v1" ]
  pull_request:
    paths: [ "android/lootchee-rom-emulator/**", ".github/workflows/lootchee-rom-emulator.yml" ]
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/lootchee-rom-emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "platforms;android-36"\n      - name: Fetch SameBoy cores
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          for core in sameboy fceumm mgba bsnes gearsystem clownmdemu pcsx_rearmed mupen64plus_next_gles3 melondsds ppsspp flycast mednafen_pce_fast stella handy geolith play; do
            for abi in arm64-v8a x86_64; do
              curl -fL "https://buildbot.libretro.com/nightly/android/latest/$abi/${core}_libretro_android.so.zip" -o "/tmp/${core}-${abi}.zip"
              unzip -p "/tmp/${core}-${abi}.zip" "${core}_libretro_android.so" > "app/src/main/jniLibs/$abi/lib${core}_libretro_android.so"
              test -s "app/src/main/jniLibs/$abi/lib${core}_libretro_android.so"
            done
          done
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK payload
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/liblootchee_frontend.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libsameboy_libretro_android.so'
          unzip -l "$APK" | grep 'lib/x86_64/liblootchee_frontend.so'
          unzip -l "$APK" | grep 'lib/x86_64/libsameboy_libretro_android.so'
          for core in fceumm mgba bsnes gearsystem clownmdemu pcsx_rearmed mupen64plus_next_gles3 melondsds ppsspp flycast mednafen_pce_fast stella handy geolith play; do
            unzip -l "$APK" | grep "lib/arm64-v8a/lib${core}_libretro_android.so"
          done
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt dump badging "$APK" | grep "package: name='com.flymaccin.lootcheerom'"
      - uses: actions/upload-artifact@v4
        with:
          name: lootchee-rom-emulator-debug
          path: android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk

  device-smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "platforms;android-36"\n      - name: Fetch SameBoy cores
        working-directory: android/lootchee-rom-emulator
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          curl -fL https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/sameboy_libretro_android.so.zip -o /tmp/sameboy-arm64.zip
          unzip -p /tmp/sameboy-arm64.zip sameboy_libretro_android.so > app/src/main/jniLibs/arm64-v8a/libsameboy_libretro_android.so
          curl -fL https://buildbot.libretro.com/nightly/android/latest/x86_64/sameboy_libretro_android.so.zip -o /tmp/sameboy-x86.zip
          unzip -p /tmp/sameboy-x86.zip sameboy_libretro_android.so > app/src/main/jniLibs/x86_64/libsameboy_libretro_android.so
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - name: Build
        working-directory: android/lootchee-rom-emulator
        run: gradle :app:assembleDebug
      - name: Boot APK and built-in ROM
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install -r android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.flymaccin.lootcheerom/.MainActivity --ez autoTest true
            sleep 8
            adb shell dumpsys activity activities | grep com.flymaccin.lootcheerom
            ! adb logcat -d | grep -E "FATAL EXCEPTION|CORE ERROR|TEST ROM ERROR"
