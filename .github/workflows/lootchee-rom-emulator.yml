name: LOOTCHEE ROM Emulator CI
on:
  push:
    branches: [ "build/lootchee-rom-emulator-v1" ]
  pull_request:
    paths: [ "android/lootchee-rom-emulator/**", ".github/workflows/lootchee-rom-emulator.yml" ]
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/lootchee-rom-emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;27.0.12077973" "platforms;android-36"
      - name: Fetch SameBoy arm64 libretro core
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fL https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/sameboy_libretro_android.so.zip -o /tmp/sameboy.zip
          unzip -p /tmp/sameboy.zip sameboy_libretro_android.so > app/src/main/jniLibs/arm64-v8a/libsameboy_libretro_android.so
          test -s app/src/main/jniLibs/arm64-v8a/libsameboy_libretro_android.so
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK payload
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/liblootchee_frontend.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libsameboy_libretro_android.so'
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)/aapt dump badging "$APK" | grep "package: name='com.flymaccin.lootcheerom'"
      - uses: actions/upload-artifact@v4
        with:
          name: lootchee-rom-emulator-debug
          path: android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk

  device-smoke:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;27.0.12077973" "platforms;android-36"
      - name: Fetch SameBoy arm64 libretro core
        working-directory: android/lootchee-rom-emulator
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fL https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/sameboy_libretro_android.so.zip -o /tmp/sameboy.zip
          unzip -p /tmp/sameboy.zip sameboy_libretro_android.so > app/src/main/jniLibs/arm64-v8a/libsameboy_libretro_android.so
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - name: Build
        working-directory: android/lootchee-rom-emulator
        run: gradle :app:assembleDebug
      - name: Boot APK and built-in ROM
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install -r android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.flymaccin.lootcheerom/.MainActivity --ez autoTest true
            sleep 8
            adb shell dumpsys activity activities | grep com.flymaccin.lootcheerom
            ! adb logcat -d | grep -E "FATAL EXCEPTION|CORE ERROR|TEST ROM ERROR"
