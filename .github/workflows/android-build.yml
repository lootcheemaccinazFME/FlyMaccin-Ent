name: Pocket Potna FME Android Build

# Pocket Potna FME v2.0.1: full Library Hub + built-in FME background assets.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Pocket Potna FME v2.0.1 source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://pocket-potna-remote.floot.app'
          curl -fL --retry 3 "$BASE/_cdn/static/f81a7fb4-33e2-409d-873a-b77d08ad97b1-pp201.part00.bin" -o /tmp/pp.part00
          curl -fL --retry 3 "$BASE/_cdn/static/14313485-2b48-4bdf-8941-72d69b543776-pp201.part01.bin" -o /tmp/pp.part01
          curl -fL --retry 3 "$BASE/_cdn/static/1d5fc5ea-0d11-4468-8aaf-c09221123191-pp201.part02.bin" -o /tmp/pp.part02
          curl -fL --retry 3 "$BASE/_cdn/static/6d1872d2-ee71-4ace-909f-c10dc3c71298-pp201.part03.bin" -o /tmp/pp.part03
          cat /tmp/pp.part00 /tmp/pp.part01 /tmp/pp.part02 /tmp/pp.part03 > /tmp/pocket-potna-fme.zip
          echo '844fb93999d27ba029b29d8f7401682a1388f95c6742fe3971c181e557231693  /tmp/pocket-potna-fme.zip' | sha256sum -c -
          unzip -oq /tmp/pocket-potna-fme.zip -d .
          chmod +x gradlew

      - name: Validate FME Built-In Background edition
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.flymaccin.pocketpotna"' app/build.gradle.kts
          grep -q 'versionName = "2.0.1"' app/build.gradle.kts
          test -f app/src/main/assets/backgrounds/12221.png
          test -f app/src/main/assets/backgrounds/12147.png
          test -f app/src/main/assets/backgrounds/12061.png
          test -f app/src/main/assets/backgrounds/11905.png
          test -f app/src/main/assets/backgrounds/10139.png
          test -f app/src/main/assets/backgrounds/a246d80f-08ec-4668-9792-c14916d10f3c-1_all_4101.jpg
          test -f app/src/main/assets/backgrounds/12206.mp4
          test -f app/src/main/assets/backgrounds/backgrounds.json
          grep -q 'BUILTIN_BACKGROUNDS' app/src/main/assets/app.js
          grep -q "\['backgrounds','Backgrounds'\]" app/src/main/assets/app.js
          grep -q 'applyBackground' app/src/main/assets/app.js
          grep -q 'LibraryHubActivity' app/src/main/AndroidManifest.xml
          grep -q '@TargetApi(29)' app/src/main/java/com/flymaccin/bookwriter/LibraryHubActivity.java
          node --check app/src/main/assets/app.js

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Name APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pocket_Potna_FME_v2.0.1-debug.apk
          sha256sum Pocket_Potna_FME_v2.0.1-debug.apk > Pocket_Potna_FME_v2.0.1-debug.apk.sha256

      - name: Upload Pocket Potna FME APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Potna-FME-v2.0.1-APK
          path: |
            Pocket_Potna_FME_v2.0.1-debug.apk
            Pocket_Potna_FME_v2.0.1-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
