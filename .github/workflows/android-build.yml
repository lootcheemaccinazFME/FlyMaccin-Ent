name: Pocket Potna Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Pocket Potna v1.2.0 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://pocket-potna-remote.floot.app/_cdn/static/cd41bb08-94bc-465b-b588-8261f832f3d0-Pocket_Potna_v1.2.0_SOURCE.zip' -o /tmp/pocket-potna.zip
          echo 'e635b86a87a1254b700b323345172ecbbbeaf3b63a0e079934f920e1af4fa93f  /tmp/pocket-potna.zip' | sha256sum -c -
          unzip -oq /tmp/pocket-potna.zip -d .
          chmod +x gradlew

      - name: Validate Pocket Potna remote edition
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.flymaccin.pocketpotna"' app/build.gradle.kts
          grep -q 'versionName = "1.2.0"' app/build.gradle.kts
          grep -q '<string name="app_name">Pocket Potna</string>' app/src/main/res/values/strings.xml
          grep -q 'Remote Session' app/src/main/assets/app.js
          grep -q 'startRemoteSession' app/src/main/java/com/flymaccin/bookwriter/BookwriterBridge.java
          grep -q 'pocket-potna-remote.floot.app' app/src/main/java/com/flymaccin/bookwriter/BookwriterBridge.java
          node --check app/src/main/assets/app.js

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Name APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pocket_Potna_v1.2.0-remote-debug.apk
          sha256sum Pocket_Potna_v1.2.0-remote-debug.apk > Pocket_Potna_v1.2.0-remote-debug.apk.sha256

      - name: Upload Pocket Potna APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Potna-v1.2.0-Remote-APK
          path: |
            Pocket_Potna_v1.2.0-remote-debug.apk
            Pocket_Potna_v1.2.0-remote-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
