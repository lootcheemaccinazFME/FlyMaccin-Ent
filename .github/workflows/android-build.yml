name: Pocket Potna FME Android Build

# Pocket Potna FME v2.0.0: full FME Library Hub + device media + imported folders.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Pocket Potna FME v2.0.0 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://pocket-potna-remote.floot.app/_cdn/static/3bfb7394-0bd9-4a35-94ec-014710fbc25d-Pocket_Potna_FME_v2.0.0_FULL_LIBRARY_HUB_SOURCE_FIXED.zip' -o /tmp/pocket-potna-fme.zip
          echo '2bf21c3f76d55cedb8b1565ef03bc06899842eaf1bcca9c160235f0d01a24982  /tmp/pocket-potna-fme.zip' | sha256sum -c -
          unzip -oq /tmp/pocket-potna-fme.zip -d .
          chmod +x gradlew

      - name: Validate FME Full Library Hub edition
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.flymaccin.pocketpotna"' app/build.gradle.kts
          grep -q 'versionName = "2.0.0"' app/build.gradle.kts
          grep -q 'LibraryHubActivity' app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/flymaccin/bookwriter/LibraryHubActivity.java
          test -f app/src/main/assets/FME_LIBRARY_MAP.json
          grep -q 'androidx.documentfile:documentfile:1.0.1' app/build.gradle.kts
          grep -q 'FME Library Hub' app/src/main/assets/app.js
          grep -q 'openLibraryHub' app/src/main/assets/app.js
          grep -q 'openLibraryHub' app/src/main/java/com/flymaccin/bookwriter/BookwriterBridge.java
          grep -q 'IMPORT FME FOLDER' app/src/main/java/com/flymaccin/bookwriter/LibraryHubActivity.java
          grep -q 'MediaStore.Audio' app/src/main/java/com/flymaccin/bookwriter/LibraryHubActivity.java
          grep -q 'MediaStore.Images' app/src/main/java/com/flymaccin/bookwriter/LibraryHubActivity.java
          grep -q 'MediaStore.Video' app/src/main/java/com/flymaccin/bookwriter/LibraryHubActivity.java
          grep -q '@TargetApi(29)' app/src/main/java/com/flymaccin/bookwriter/LibraryHubActivity.java
          node --check app/src/main/assets/app.js

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Name APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pocket_Potna_FME_v2.0.0-debug.apk
          sha256sum Pocket_Potna_FME_v2.0.0-debug.apk > Pocket_Potna_FME_v2.0.0-debug.apk.sha256

      - name: Upload Pocket Potna FME APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Potna-FME-v2.0.0-APK
          path: |
            Pocket_Potna_FME_v2.0.0-debug.apk
            Pocket_Potna_FME_v2.0.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
