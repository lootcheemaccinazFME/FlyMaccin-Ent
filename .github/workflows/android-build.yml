name: Pocket Potna FME Android Build

# Pocket Potna FME v1.9.0: installed app/game launcher + native Media3 music/video/movie player.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Pocket Potna FME v1.9.0 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://pocket-potna-remote.floot.app/_cdn/static/b8d2bb3b-ce56-4720-aad2-9c14f281f462-Pocket_Potna_FME_v1.9.0_DEVICE_HUB_SOURCE.zip' -o /tmp/pocket-potna-fme.zip
          echo '624e987aa533a019791d546da146acf0281ed2511875246cb91d77314f71ea76  /tmp/pocket-potna-fme.zip' | sha256sum -c -
          unzip -oq /tmp/pocket-potna-fme.zip -d .
          chmod +x gradlew

      - name: Validate FME Device Hub edition
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.flymaccin.pocketpotna"' app/build.gradle.kts
          grep -q 'versionName = "1.9.0"' app/build.gradle.kts
          grep -q 'android.permission.QUERY_ALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -q 'AppLauncherActivity' app/src/main/AndroidManifest.xml
          grep -q 'MediaPlayerActivity' app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/flymaccin/bookwriter/AppLauncherActivity.java
          test -f app/src/main/java/com/flymaccin/bookwriter/MediaPlayerActivity.java
          grep -q 'androidx.media3:media3-exoplayer:1.11.0' app/build.gradle.kts
          grep -q 'Apps & Media' app/src/main/assets/app.js
          grep -q 'openAppLauncher' app/src/main/assets/app.js
          grep -q 'openMediaRoom' app/src/main/assets/app.js
          grep -q 'openAppLauncher' app/src/main/java/com/flymaccin/bookwriter/BookwriterBridge.java
          grep -q 'openMediaRoom' app/src/main/java/com/flymaccin/bookwriter/BookwriterBridge.java
          grep -q 'ZERO-DOLLAR OPERATING LAW ACTIVE' app/src/main/assets/app.js
          grep -q 'COMPANION + TOOLS' app/src/main/assets/app.js
          node --check app/src/main/assets/app.js

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Name APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pocket_Potna_FME_v1.9.0-debug.apk
          sha256sum Pocket_Potna_FME_v1.9.0-debug.apk > Pocket_Potna_FME_v1.9.0-debug.apk.sha256

      - name: Upload Pocket Potna FME APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Potna-FME-v1.9.0-APK
          path: |
            Pocket_Potna_FME_v1.9.0-debug.apk
            Pocket_Potna_FME_v1.9.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
