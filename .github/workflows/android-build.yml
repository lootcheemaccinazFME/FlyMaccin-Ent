name: Pocket Potna FME Android Build

# Pocket Potna FME v1.3.0: FME-only auto creation, persistent remote pairing, browser, bundled UMD/library/audit brain.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Pocket Potna FME v1.3.0 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://pocket-potna-remote.floot.app/_cdn/static/563f37c7-790b-4836-9bcb-aeb1632b399a-Pocket_Potna_FME_v1.3.0_SOURCE_FIXED.zip' -o /tmp/pocket-potna-fme.zip
          echo 'a38fd2dd732c0fcf0f4d414d0b927384c4f1041442ee45649ed909e3762d813c  /tmp/pocket-potna-fme.zip' | sha256sum -c -
          unzip -oq /tmp/pocket-potna-fme.zip -d .
          chmod +x gradlew

      - name: Validate Pocket Potna FME edition
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.flymaccin.pocketpotna"' app/build.gradle.kts
          grep -q 'versionName = "1.3.0"' app/build.gradle.kts
          grep -q '<string name="app_name">Pocket Potna FME</string>' app/src/main/res/values/strings.xml
          grep -q 'FME_CONTEXT' app/src/main/assets/app.js
          grep -q 'CREATE SOMETHING FME' app/src/main/assets/app.js
          grep -q 'AI + Human + ChatGPT' app/src/main/assets/app.js
          grep -q 'Universal_Master_Doctrine_Current_Indexed_v1.md' app/src/main/assets/app.js
          grep -q 'hasRemoteSession' app/src/main/java/com/flymaccin/bookwriter/BookwriterBridge.java
          grep -q 'BrowserActivity' app/src/main/java/com/flymaccin/bookwriter/BookwriterBridge.java
          grep -q 'URLEncoder.encode(value,"UTF-8")' app/src/main/java/com/flymaccin/bookwriter/BrowserActivity.java
          test -f app/src/main/assets/Universal_Master_Doctrine_Current_Indexed_v1.md
          test -f app/src/main/assets/FME_SKULL_MASTER_KNOWLEDGE_CORE.json
          test -f app/src/main/assets/MACCIN_AZZ_UNIVERSAL_MEMORY_ARCHIVE.md
          node --check app/src/main/assets/app.js

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Name APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pocket_Potna_FME_v1.3.0-debug.apk
          sha256sum Pocket_Potna_FME_v1.3.0-debug.apk > Pocket_Potna_FME_v1.3.0-debug.apk.sha256

      - name: Upload Pocket Potna FME APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Potna-FME-v1.3.0-APK
          path: |
            Pocket_Potna_FME_v1.3.0-debug.apk
            Pocket_Potna_FME_v1.3.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
