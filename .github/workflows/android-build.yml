name: Pocket Potna FME Android Build

# Pocket Potna FME v1.8.1: Chat Mode keeps separate history but may launch production tools on explicit request.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Pocket Potna FME v1.8.1 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 'https://pocket-potna-remote.floot.app/_cdn/static/fd151711-328f-4cb7-af7c-866a2716a854-Pocket_Potna_FME_v1.8.1_CHAT_TOOLS_SOURCE.zip' -o /tmp/pocket-potna-fme.zip
          echo '652895a8de3a0513d97fa33778d2672ae572369428ae5b178ef360c104c9e8dd  /tmp/pocket-potna-fme.zip' | sha256sum -c -
          unzip -oq /tmp/pocket-potna-fme.zip -d .
          chmod +x gradlew

      - name: Validate FME Chat Tool edition
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.flymaccin.pocketpotna"' app/build.gradle.kts
          grep -q 'versionName = "1.8.1"' app/build.gradle.kts
          grep -q '<string name="app_name">Pocket Potna FME</string>' app/src/main/res/values/strings.xml
          grep -q 'ZERO-DOLLAR OPERATING LAW ACTIVE' app/src/main/assets/app.js
          grep -q 'NO AI · AUTHOR MODE' app/src/main/assets/app.js
          grep -q 'Notebook / Drawing / Painting Room' app/src/main/assets/app.js
          grep -q 'COMPANION + TOOLS' app/src/main/assets/app.js
          grep -q 'CHAT TOOL LAUNCH' app/src/main/assets/app.js
          grep -q 'allowed to launch production tools' app/src/main/assets/app.js
          grep -q 'ChatGPT Mode' app/src/main/assets/app.js
          grep -q 'openSplitStudio' app/src/main/assets/app.js
          grep -q 'openSplitStudio' app/src/main/java/com/flymaccin/bookwriter/BookwriterBridge.java
          grep -q 'SplitStudioActivity' app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/flymaccin/bookwriter/SplitStudioActivity.java
          grep -q 'FREE LOCAL ENGINE FIRST' app/src/main/assets/app.js
          grep -q 'getBoolean("paidProvidersEnabled",false)' app/src/main/java/com/flymaccin/bookwriter/BookwriterBridge.java
          grep -q 'com.google.mediapipe:tasks-genai:latest.release' app/build.gradle.kts
          node --check app/src/main/assets/app.js

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Name APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pocket_Potna_FME_v1.8.1-debug.apk
          sha256sum Pocket_Potna_FME_v1.8.1-debug.apk > Pocket_Potna_FME_v1.8.1-debug.apk.sha256

      - name: Upload Pocket Potna FME APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Potna-FME-v1.8.1-APK
          path: |
            Pocket_Potna_FME_v1.8.1-debug.apk
            Pocket_Potna_FME_v1.8.1-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
