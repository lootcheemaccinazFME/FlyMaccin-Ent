name: Pocket Potna Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.pocket-potna/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Restore Pocket Potna source
        shell: bash
        run: |
          set -euo pipefail
          cat .pocket-potna/source.b64.part-00 .pocket-potna/source.b64.part-01 .pocket-potna/source.b64.part-02 > /tmp/pocket-potna.b64
          echo '7338906bf2fea9fa48a56c025a24b6fc24753e472514339841fbfc81935ce9bd  /tmp/pocket-potna.b64' | sha256sum -c -
          base64 -d /tmp/pocket-potna.b64 > /tmp/pocket-potna.tgz
          echo 'c70cbb27378bd422b1379146fe09b8d49b57f21338c55c89d8534cb66299c7ed  /tmp/pocket-potna.tgz' | sha256sum -c -
          tar -xzf /tmp/pocket-potna.tgz -C .
          chmod +x gradlew

      - name: Validate Pocket Potna identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.flymaccin.pocketpotna"' app/build.gradle.kts
          grep -q '<string name="app_name">Pocket Potna</string>' app/src/main/res/values/strings.xml
          grep -q 'AI Chatbot' app/src/main/assets/app.js
          grep -q 'Generator Hub' app/src/main/assets/app.js
          grep -q 'Agent Maker' app/src/main/assets/app.js
          node --check app/src/main/assets/app.js

      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Name APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Pocket_Potna_v1.1.0-debug.apk
          sha256sum Pocket_Potna_v1.1.0-debug.apk > Pocket_Potna_v1.1.0-debug.apk.sha256

      - name: Upload Pocket Potna APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Potna-v1.1.0-APK
          path: |
            Pocket_Potna_v1.1.0-debug.apk
            Pocket_Potna_v1.1.0-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
