name: Demonic DAW 2 v0.1.0 Alpha 1

on:
  workflow_dispatch:
  push:
    branches:
      - dev/demonic-daw-2-v0.1.0-alpha1
    paths:
      - '.github/workflows/demonic-daw-2-alpha1.yml'

permissions:
  contents: read

jobs:
  build-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SRC_URL: https://pocket-potna-remote.floot.app/_cdn/static/7a8dbabe-7800-4d49-89a0-5986e7a1cf3b-Demonic_DAW_2_v0.1.0_ALPHA1_SOURCE_build2.zip
      SRC_SHA256: 3439c829865bde9413b312ac5feb3140ace2aa1e6940aadc58fc7294a39ec161
      PKG: com.flymaccin.demonicdaw2
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Fetch exact Demonic DAW 2 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "$SRC_URL" -o /tmp/demonic2.zip
          echo "$SRC_SHA256  /tmp/demonic2.zip" | sha256sum -c -
          mkdir -p /tmp/demonic2
          unzip -q /tmp/demonic2.zip -d /tmp/demonic2
          test -f /tmp/demonic2/app/src/main/java/com/flymaccin/demonicdaw2/MainActivity.kt
          grep -q 'applicationId = "com.flymaccin.demonicdaw2"' /tmp/demonic2/app/build.gradle.kts
          grep -q 'versionName = "0.1.0-alpha1"' /tmp/demonic2/app/build.gradle.kts

      - name: Unit build lint and assemble
        shell: bash
        working-directory: /tmp/demonic2
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='$PKG'" /tmp/apk-badging.txt
          grep -q "versionName='0.1.0-alpha1'" /tmp/apk-badging.txt

      - name: Verify core Alpha 1 implementation
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/demonic2/app/src/main/java/com/flymaccin/demonicdaw2
          grep -q 'BOUNCE WAV' "$SRC/MainActivity.kt"
          grep -q 'MediaRecorder.AudioSource.MIC' "$SRC/TakeRecorder.kt"
          grep -q 'fme.demonicdaw.project' "$SRC/SessionStore.kt"
          grep -q 'SoundPool.Builder' "$SRC/DrumAudioEngine.kt"
          grep -q 'writeAscii(d, "RIFF")' "$SRC/PatternRenderer.kt"
          test -s /tmp/demonic2/app/src/main/res/raw/kick.wav
          test -s /tmp/demonic2/app/src/main/res/raw/snare.wav
          test -s /tmp/demonic2/app/src/main/res/raw/hat.wav
          test -s /tmp/demonic2/app/src/main/res/raw/perc.wav

      - name: Install emulator image
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" 'emulator' 'system-images;android-36;google_apis;x86_64'

      - name: Boot Android 36 and smoke test
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$PATH"
          ADB="$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$ADB"
          "$ADB" version
          export ANDROID_AVD_HOME="$RUNNER_TEMP/demonic2-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" create avd \
            -n demonic2_api36 -k 'system-images;android-36;google_apis;x86_64' \
            --device pixel_6 --force --path "$ANDROID_AVD_HOME/demonic2_api36.avd"
          cat > "$ANDROID_AVD_HOME/demonic2_api36.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$ANDROID_AVD_HOME/demonic2_api36.avd
          path.rel=demonic2_api36.avd
          target=android-36
          EOF
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd demonic2_api36 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          EMU_PID=$!
          trap 'kill $EMU_PID || true' EXIT
          timeout 180 "$ADB" wait-for-device
          timeout 180 bash -c 'until [ "$("$ANDROID_SDK_ROOT/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 2; done'
          "$ADB" shell input keyevent 82 || true
          APK=/tmp/demonic2/app/build/outputs/apk/debug/app-debug.apk
          "$ADB" install -r "$APK" | tee /tmp/install.txt
          grep -q 'Success' /tmp/install.txt
          "$ADB" shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1 >/tmp/launch.txt 2>&1
          sleep 7
          PID=$("$ADB" shell pidof "$PKG" | tr -d '\r')
          test -n "$PID"
          echo "PID=$PID" | tee /tmp/runtime.txt
          "$ADB" shell dumpsys package "$PKG" | grep -E 'versionName|versionCode' | head -10 | tee -a /tmp/runtime.txt
          "$ADB" logcat -d > /tmp/logcat.txt
          if grep -A12 'FATAL EXCEPTION' /tmp/logcat.txt | grep -q "$PKG"; then
            echo 'App-specific fatal exception detected' >&2
            exit 1
          fi
          "$ADB" exec-out screencap -p > /tmp/demonic2-alpha1.png

      - name: Collect artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/out
          cp /tmp/demonic2/app/build/outputs/apk/debug/app-debug.apk /tmp/out/Demonic_DAW_2_v0.1.0-alpha1-debug.apk 2>/dev/null || true
          cp /tmp/demonic2.zip /tmp/out/Demonic_DAW_2_v0.1.0_ALPHA1_SOURCE.zip 2>/dev/null || true
          cp /tmp/apk-badging.txt /tmp/out/ 2>/dev/null || true
          cp /tmp/runtime.txt /tmp/out/ 2>/dev/null || true
          cp /tmp/install.txt /tmp/out/ 2>/dev/null || true
          cp /tmp/logcat.txt /tmp/out/ 2>/dev/null || true
          cp /tmp/emulator.log /tmp/out/ 2>/dev/null || true
          cp /tmp/demonic2-alpha1.png /tmp/out/ 2>/dev/null || true
          (cd /tmp/out && sha256sum * > SHA256SUMS.txt || true)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Demonic-DAW-2-v0.1.0-alpha1
          path: /tmp/out
          if-no-files-found: error
          retention-days: 30
