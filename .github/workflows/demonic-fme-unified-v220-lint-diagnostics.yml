name: Diagnose Lint Demonic FME Unified Studio v2.2.0

on:
  push:
    branches:
      - release/demonic-fme-unified-v2.2.0
    paths:
      - '.github/workflows/demonic-fme-unified-v220-lint-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Fetch source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fme-v220
          curl -fL --retry 3 'https://pocket-potna-remote.floot.app/_cdn/static/235a9d76-de17-4fd2-a6ec-2ac463dd3806-Demonic_FME_Unified_Studio_v2.2.0_SOURCE.zip' -o /tmp/fme-v220/source.zip
          echo '635ecfbdf69421c88db72ba02440efe56f4413cab4f4ede2635121ceafbdf2a7  /tmp/fme-v220/source.zip' | sha256sum -c -
          unzip -q /tmp/fme-v220/source.zip -d /tmp/fme-v220/src
          APP_DIR=/tmp/fme-v220/src/Demonic_FME_Unified_Studio_v2.2.0_SOURCE
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
      - name: Run lint and print full error set
        shell: bash
        run: |
          set +e
          cd "$APP_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug
          STATUS=$?
          REPORT="$APP_DIR/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          echo '===== FULL LINT ERRORS ====='
          if [ -f "$REPORT" ]; then
            grep -n -B2 -A4 'Error:' "$REPORT" || true
            cp "$REPORT" "$GITHUB_WORKSPACE/lint-results-debug.txt"
          else
            echo 'lint text report missing'
          fi
          exit $STATUS
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Demonic-FME-Unified-v2.2.0-lint-report
          path: lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 7
