name: Gummie Bear Academy Solo APK
on:
  push:
    branches: [build/fme-everything-one-apk-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/lootchee-rom-emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle --no-daemon :academy:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gummie-Bear-Academy-Solo-APK
          path: android/lootchee-rom-emulator/academy/build/outputs/apk/debug/academy-debug.apk
