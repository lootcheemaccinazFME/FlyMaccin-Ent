name: Build Demonic FME Unified Studio v2.2.0

on:
  push:
    branches:
      - release/demonic-fme-unified-v2.2.0
    paths:
      - 'release-capsules/demonic-fme-unified-v2.2.0/**'
      - '.github/workflows/demonic-fme-unified-v220.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      FME_KEYSTORE_PASSWORD: ${{ secrets.FME_KEYSTORE_PASSWORD }}
      FME_KEY_ALIAS: ${{ secrets.FME_KEY_ALIAS }}
      FME_KEY_PASSWORD: ${{ secrets.FME_KEY_PASSWORD }}
      FME_RELEASE_KEYSTORE_BASE64: ${{ secrets.FME_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Rehydrate source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fme-v220
          cat release-capsules/demonic-fme-unified-v2.2.0/source.b64.part-* | tr -d '\n' | base64 -d > /tmp/fme-v220/source.zip
          echo '635ecfbdf69421c88db72ba02440efe56f4413cab4f4ede2635121ceafbdf2a7  /tmp/fme-v220/source.zip' | sha256sum -c -
          unzip -q /tmp/fme-v220/source.zip -d /tmp/fme-v220/src
          APP_DIR=$(find /tmp/fme-v220/src -maxdepth 1 -type d -name 'Demonic_FME_Unified_Studio_v2.2.0_SOURCE' | head -1)
          test -n "$APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
      - name: Static checks
        shell: bash
        run: |
          set -euo pipefail
          node --check "$APP_DIR/app/src/main/assets/app.js"
          grep -q 'applicationId = "com.flymaccin.pocketpotna"' "$APP_DIR/app/build.gradle.kts"
          grep -q 'versionName = "2.2.0"' "$APP_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 230' "$APP_DIR/app/build.gradle.kts"
      - name: Configure release signer if available
        shell: bash
        run: |
          if [ -n "${FME_RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$FME_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fme-release.jks"
            echo "FME_KEYSTORE_PATH=$RUNNER_TEMP/fme-release.jks" >> "$GITHUB_ENV"
            echo 'RELEASE_SIGNING_AVAILABLE=true' >> "$GITHUB_ENV"
          else
            echo 'RELEASE_SIGNING_AVAILABLE=false' >> "$GITHUB_ENV"
          fi
      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          chmod +x gradlew scripts/*.sh || true
          ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug
          if [ "${RELEASE_SIGNING_AVAILABLE}" = 'true' ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease
          fi
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$APP_DIR/app/build/outputs" -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          sha256sum "$GITHUB_WORKSPACE"/out/* > "$GITHUB_WORKSPACE/out/SHA256SUMS.txt"
          ls -lh "$GITHUB_WORKSPACE/out"
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: Demonic-FME-Unified-Studio-v2.2.0
          path: out/*
          if-no-files-found: error
