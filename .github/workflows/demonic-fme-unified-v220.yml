name: Build Demonic FME Unified Studio v2.2.0

on:
  push:
    branches:
      - release/demonic-fme-unified-v2.2.0
    paths:
      - '.github/workflows/demonic-fme-unified-v220.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
      FME_KEYSTORE_PASSWORD: ${{ secrets.FME_KEYSTORE_PASSWORD }}
      FME_KEY_ALIAS: ${{ secrets.FME_KEY_ALIAS }}
      FME_KEY_PASSWORD: ${{ secrets.FME_KEY_PASSWORD }}
      FME_RELEASE_KEYSTORE_BASE64: ${{ secrets.FME_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36 from runner SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Fetch canonical unified source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fme-v220
          curl -fL --retry 3 'https://pocket-potna-remote.floot.app/_cdn/static/235a9d76-de17-4fd2-a6ec-2ac463dd3806-Demonic_FME_Unified_Studio_v2.2.0_SOURCE.zip' -o /tmp/fme-v220/source.zip
          echo '635ecfbdf69421c88db72ba02440efe56f4413cab4f4ede2635121ceafbdf2a7  /tmp/fme-v220/source.zip' | sha256sum -c -
          unzip -q /tmp/fme-v220/source.zip -d /tmp/fme-v220/src
          APP_DIR=$(find /tmp/fme-v220/src -maxdepth 1 -type d -name 'Demonic_FME_Unified_Studio_v2.2.0_SOURCE' | head -1)
          test -n "$APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
      - name: Validate unified studio identity
        shell: bash
        run: |
          set -euo pipefail
          node --check "$APP_DIR/app/src/main/assets/app.js"
          grep -q 'applicationId = "com.flymaccin.pocketpotna"' "$APP_DIR/app/build.gradle.kts"
          grep -q 'versionName = "2.2.0"' "$APP_DIR/app/build.gradle.kts"
          grep -q 'versionCode = 230' "$APP_DIR/app/build.gradle.kts"
          grep -q 'Demonic DAW' "$APP_DIR/app/src/main/assets/app.js"
          grep -q 'Unified Backup' "$APP_DIR/app/src/main/assets/app.js"
      - name: Configure protected FME signer when available
        shell: bash
        run: |
          if [ -n "${FME_RELEASE_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$FME_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fme-release.jks"
            echo "FME_KEYSTORE_PATH=$RUNNER_TEMP/fme-release.jks" >> "$GITHUB_ENV"
            echo 'RELEASE_SIGNING_AVAILABLE=true' >> "$GITHUB_ENV"
          else
            echo 'RELEASE_SIGNING_AVAILABLE=false' >> "$GITHUB_ENV"
          fi
      - name: Build debug and run QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          chmod +x gradlew scripts/*.sh || true
          ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug
      - name: Build protected release when signer is available
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RELEASE_SIGNING_AVAILABLE}" = 'true' ]; then
            cd "$APP_DIR"
            ./gradlew --no-daemon bundleRelease assembleRelease
          else
            echo 'Protected FME release signer is not available in this workflow context; debug build still produced.'
          fi
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          find "$APP_DIR/app/build/outputs" -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          sha256sum "$GITHUB_WORKSPACE"/out/* > "$GITHUB_WORKSPACE/out/SHA256SUMS.txt"
          printf 'versionName=2.2.0\nversionCode=230\npackage=com.flymaccin.pocketpotna\n' > "$GITHUB_WORKSPACE/out/BUILD_IDENTITY.txt"
          ls -lh "$GITHUB_WORKSPACE/out"
      - name: Upload unified studio binaries
        uses: actions/upload-artifact@v4
        with:
          name: Demonic-FME-Unified-Studio-v2.2.0
          path: out/*
          if-no-files-found: error
          retention-days: 30
