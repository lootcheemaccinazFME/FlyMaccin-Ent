name: Build Demonic AI Studio APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android/demonic-ai-studio-hub/**"
      - ".github/workflows/build-demonic-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/demonic-ai-studio-hub
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FME-Demonic-AI-Studio-APK
          path: android/demonic-ai-studio-hub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
