name: Build Demonic AI Studio APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android/demonic-ai-studio-hub/**"
      - ".github/workflows/build-demonic-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/demonic-ai-studio-hub
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable debug signer
        run: base64 --decode ../../.github/demonic-studio-debug.keystore.b64 > app/studio-debug.keystore

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/demonic-ai-studio-hub/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.flymaccin.demonicaistudio android.permission.RECORD_AUDIO
            adb logcat -c
            adb shell am start -W -n com.flymaccin.demonicaistudio/.StudioActivity
            sleep 5
            echo "=== DEMONIC PROCESS ==="
            adb shell ps -A | grep com.flymaccin.demonicaistudio || true
            echo "=== FOCUSED ACTIVITY ==="
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity|com.flymaccin.demonicaistudio" | tail -40 || true
            echo "=== CRASH BUFFER ==="
            adb logcat -b crash -d || true
            adb shell pidof com.flymaccin.demonicaistudio || (echo "DEMONIC_PROCESS_DIED"; adb logcat -d | grep -E -A 80 -B 20 "FATAL EXCEPTION|AndroidRuntime|com.flymaccin.demonicaistudio" || true; exit 1)
            adb shell input tap 300 330
            sleep 1
            adb shell input tap 220 420
            sleep 1
            adb shell input tap 620 720
            sleep 1
            adb shell input tap 700 720
            sleep 1
            adb shell input tap 1060 720
            sleep 1
            ! adb logcat -b crash -d | grep -q 'com.flymaccin.demonicaistudio' || (adb logcat -b crash -d; exit 1)
            echo "=== POCKETBAND SEMANTIC DAW SMOKE ==="
            adb logcat -c
            adb shell am force-stop com.flymaccin.demonicaistudio
            adb shell am start -W -n com.flymaccin.demonicaistudio/.PocketBandSmokeActivity
            timeout 45s sh -c 'until adb logcat -d -s PocketBandSmoke:I "*:S" | grep -q "POCKETBAND_SMOKE_PASS"; do
              adb logcat -d -s PocketBandSmoke:E "*:S" | grep -q "POCKETBAND_SMOKE_FAIL" && exit 2
              sleep 1
            done'
            adb logcat -d -s PocketBandSmoke:V "*:S"
            adb logcat -d -s PocketBandSmoke:I "*:S" | grep "POCKETBAND_RENDER_PASS"
            adb logcat -d -s PocketBandSmoke:I "*:S" | grep "POCKETBAND_PLAYBACK_STARTED"
            adb logcat -d -s PocketBandSmoke:I "*:S" | grep "POCKETBAND_SMOKE_PASS"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FME-Demonic-AI-Studio-APK
          path: android/demonic-ai-studio-hub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
