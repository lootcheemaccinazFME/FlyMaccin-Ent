name: Build Demonic AI Studio APK

on:
  pull_request:
    branches: [main]
    paths:
      - "android/demonic-ai-studio-hub/**"
      - ".github/workflows/build-demonic-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/demonic-ai-studio-hub
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable debug signer
        run: base64 --decode ../../.github/demonic-studio-debug.keystore.b64 > app/studio-debug.keystore

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r android/demonic-ai-studio-hub/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.flymaccin.demonicaistudio android.permission.RECORD_AUDIO
            adb shell am start -W -n com.flymaccin.demonicaistudio/.StudioActivity
            sleep 5
            adb shell pidof com.flymaccin.demonicaistudio
            if adb logcat -d '*:E' | grep -q 'FATAL EXCEPTION.*com.flymaccin.demonicaistudio'; then exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FME-Demonic-AI-Studio-APK
          path: android/demonic-ai-studio-hub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
