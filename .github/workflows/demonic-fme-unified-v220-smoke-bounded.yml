name: Bounded Smoke Demonic FME Unified Studio v2.2.0

on:
  push:
    branches:
      - release/demonic-fme-unified-v2.2.0
    paths:
      - '.github/workflows/demonic-fme-unified-v220-smoke-bounded.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare SDK and KVM
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "emulator" "system-images;android-36;google_apis;x86_64"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Fetch four-fix source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fme-v220-smoke
          curl -fL --retry 3 'https://pocket-potna-remote.floot.app/_cdn/static/6c26f580-023f-4758-a682-207113ef792a-Demonic_FME_Unified_Studio_v2.2.0_HARDENED2_SOURCE.zip' -o /tmp/fme-v220-smoke/source.zip
          echo '3c606a0986a5d949bd281690e08f9439976cceb1ef689a75f4d23e70ff8bbe35  /tmp/fme-v220-smoke/source.zip' | sha256sum -c -
          unzip -q /tmp/fme-v220-smoke/source.zip -d /tmp/fme-v220-smoke/src
          APP_DIR=/tmp/fme-v220-smoke/src/Demonic_FME_Unified_Studio_v2.2.0_SOURCE
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
      - name: Assemble hardened APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          APK=$(find "$APP_DIR/app/build/outputs/apk/debug" -name '*.apk' | head -1)
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/out/Demonic_FME_Unified_Studio_v2.2.0_HARDENED-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/out/Demonic_FME_Unified_Studio_v2.2.0_HARDENED-debug.apk" > "$GITHUB_WORKSPACE/out/APK_SHA256.txt"
      - name: Create Android 36 AVD
        shell: bash
        run: |
          set -euo pipefail
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n fme_api36_bound -k 'system-images;android-36;google_apis;x86_64' --force
      - name: Boot, install, launch, inspect
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          ACCEL='-accel off'
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL='-accel on'; fi
          nohup emulator -avd fme_api36_bound -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect $ACCEL >/tmp/fme-emulator.log 2>&1 &
          if ! timeout 150 adb wait-for-device; then
            echo 'ADB_DEVICE_TIMEOUT' | tee "$GITHUB_WORKSPACE/out/runtime-smoke.txt"
            cp /tmp/fme-emulator.log "$GITHUB_WORKSPACE/out/emulator-host.log" || true
            exit 1
          fi
          READY=0
          for i in $(seq 1 90); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT" = '1' ]; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != '1' ]; then
            echo 'BOOT_TIMEOUT' | tee "$GITHUB_WORKSPACE/out/runtime-smoke.txt"
            cp /tmp/fme-emulator.log "$GITHUB_WORKSPACE/out/emulator-host.log" || true
            exit 1
          fi
          APK="$GITHUB_WORKSPACE/out/Demonic_FME_Unified_Studio_v2.2.0_HARDENED-debug.apk"
          adb install -r "$APK"
          adb logcat -c
          adb shell monkey -p com.flymaccin.pocketpotna -c android.intent.category.LAUNCHER 1
          sleep 10
          PID=$(adb shell pidof com.flymaccin.pocketpotna | tr -d '\r')
          adb shell dumpsys activity activities > "$GITHUB_WORKSPACE/out/dumpsys-activity.txt"
          adb logcat -d > "$GITHUB_WORKSPACE/out/logcat.txt"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/out/emulator-launch.png" || true
          cp /tmp/fme-emulator.log "$GITHUB_WORKSPACE/out/emulator-host.log" || true
          {
            echo "pid=$PID"
            echo "boot=PASS"
            echo "install=PASS"
          } > "$GITHUB_WORKSPACE/out/runtime-smoke.txt"
          if [ -z "$PID" ]; then echo 'launch=FAIL' >> "$GITHUB_WORKSPACE/out/runtime-smoke.txt"; exit 1; fi
          if grep -q -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL' "$GITHUB_WORKSPACE/out/logcat.txt"; then
            echo 'launch=FATAL_EXCEPTION' >> "$GITHUB_WORKSPACE/out/runtime-smoke.txt"
            grep -A12 -B3 -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL' "$GITHUB_WORKSPACE/out/logcat.txt" || true
            exit 1
          fi
          echo 'launch=PASS' >> "$GITHUB_WORKSPACE/out/runtime-smoke.txt"
      - name: Always collect emulator diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ -f /tmp/fme-emulator.log ] && [ ! -f "$GITHUB_WORKSPACE/out/emulator-host.log" ]; then cp /tmp/fme-emulator.log "$GITHUB_WORKSPACE/out/emulator-host.log"; fi
          cd "$GITHUB_WORKSPACE/out"
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
      - name: Upload hardened APK and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Demonic-FME-Unified-Studio-v2.2.0-hardened-smoke
          path: out/*
          if-no-files-found: error
          retention-days: 30
