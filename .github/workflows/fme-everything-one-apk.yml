name: FME Everything One APK Gate
on:
  push:
    branches: [ build/fme-everything-one-apk-v1 ]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Enforce zero FME launcher dependency
        run: |
          set -euo pipefail
          ROOT=android/lootchee-rom-emulator
          ! grep -R --include='*.kt' --include='*.java' -E 'getLaunchIntentForPackage|com\.flymaccin\.(pocketpotna|demonictv|octop|videogenerator|demonicdaw)' "$ROOT/app/src/main" || { echo 'FME launcher dependency found'; exit 1; }
          grep -q '1 APP → 0 LAUNCHER → 1 APK → EVERYTHING FME INSIDE' "$ROOT/FME_ONE_APP_LAW.md"
          REG="$ROOT/app/src/main/java/com/flymaccin/lootcheerom/FmeRoomRegistry.kt"
          test "$(grep -c 'FmeRoom("daw","Demonic DAW"' "$REG")" -eq 1
          ! grep -q 'FmeRoom("studio"' "$REG"
          ! grep -q 'FmeRoom("daw2"' "$REG"
          MOD="$ROOT/app/src/main/java/com/flymaccin/lootcheerom/DemonicDawModules.kt"
          grep -q 'Piano Studio' "$MOD"
          grep -q 'DAW 2 Generation' "$MOD"
      - name: Build canonical single APK
        working-directory: android/lootchee-rom-emulator
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify exactly one APK
        run: |
          set -euo pipefail
          ROOT=android/lootchee-rom-emulator
          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test "$(find "$ROOT" -type f -name '*.apk' | wc -l)" -eq 1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging
          grep -q "package: name='com.flymaccin.lootcheerom'" /tmp/badging
          sha256sum "$APK" > /tmp/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FME-EVERYTHING-ONE-APK
          path: |
            android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk
            android/lootchee-rom-emulator/FME_ONE_APP_LAW.md
            /tmp/SHA256SUMS.txt
          if-no-files-found: error
