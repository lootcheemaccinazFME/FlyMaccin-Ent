name: Demonic DAW Android QA
on:
  workflow_dispatch:
  push:
    branches: [ 'build/demonic-daw-apk-20260917' ]
    paths:
      - '.github/qa-trigger-demonic-daw.txt'
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate bundled Demonic Factory samples
        run: python3 .github/scripts/generate_demonic_factory.py
      - name: Configure Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build QA APK
        working-directory: demonic-daw
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle assembleDebug --stacktrace
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -cores 2 -memory 4096
          script: |
            set -eu
            mkdir -p qa-output
            adb wait-for-device
            timeout 300 sh -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r")" = "1" ]; do sleep 2; done'
            timeout 180 sh -c 'until adb shell service check package 2>/dev/null | grep -q "found"; do sleep 2; done'
            timeout 120 sh -c 'until adb shell service check activity 2>/dev/null | grep -q "found"; do sleep 2; done'
            sleep 10
            adb install -r demonic-daw/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            # Pre-grant microphone so Android's runtime permission dialog cannot mask the WebView during UI QA.
            adb shell pm grant com.flymaccin.demonicdaw android.permission.RECORD_AUDIO || true
            adb shell settings put global airplane_mode_on 1
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true || true
            adb shell am force-stop com.flymaccin.demonicdaw
            adb shell am start -W -n com.flymaccin.demonicdaw/.MainActivity || true
            sleep 8
            adb exec-out screencap -p > qa-output/offline-boot.png
            adb shell dumpsys activity activities > qa-output/offline-activities.txt
            grep -q 'com.flymaccin.demonicdaw/.MainActivity' qa-output/offline-activities.txt
            adb logcat -d > qa-output/offline-logcat.txt
            ! grep -E 'FATAL EXCEPTION|UnsatisfiedLinkError|Process: com.flymaccin.demonicdaw' qa-output/offline-logcat.txt
            # UIAutomator only exposes the WebView container on API 35, not its HTML DOM.
            # Verify the packaged local FME UI and native bridge deterministically instead.
            unzip -p demonic-daw/app/build/outputs/apk/debug/app-debug.apk assets/offline.html > qa-output/packaged-offline.html
            grep -q 'FME SAMPLES' qa-output/packaged-offline.html
            grep -q 'STUDIO' qa-output/packaged-offline.html
            ! grep -q 'Grand Piano' qa-output/packaged-offline.html
            grep -q 'DEMONIC_DAW_LOCAL_FME_UI_V121' demonic-daw/app/src/main/java/com/flymaccin/demonicdaw/MainActivity.java
            adb shell settings put global airplane_mode_on 0
            adb shell am broadcast -a android.intent.action.AIRPLANE_MODE --ez state false || true
            sleep 4
            adb shell am force-stop com.flymaccin.demonicdaw
            adb logcat -c
            adb shell am start -W -n com.flymaccin.demonicdaw/.MainActivity || true
            sleep 8
            adb exec-out screencap -p > qa-output/online-boot.png
            adb shell dumpsys activity activities > qa-output/online-activities.txt
            grep -q 'com.flymaccin.demonicdaw/.MainActivity' qa-output/online-activities.txt
            adb logcat -d > qa-output/online-logcat.txt
            ! grep -E 'FATAL EXCEPTION|UnsatisfiedLinkError|Process: com.flymaccin.demonicdaw' qa-output/online-logcat.txt
            # Local-first contract is identical online: activity alive, no crash, bundled FME UI remains authoritative.
            unzip -p demonic-daw/app/build/outputs/apk/debug/app-debug.apk assets/offline.html > qa-output/packaged-online-ui.html
            grep -q 'FME SAMPLES' qa-output/packaged-online-ui.html
            grep -q 'STUDIO' qa-output/packaged-online-ui.html
            ! grep -q 'Grand Piano' qa-output/packaged-online-ui.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demonic-daw-qa-evidence
          path: qa-output/
          if-no-files-found: warn
