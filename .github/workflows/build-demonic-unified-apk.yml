name: Build Demonic Unified APK

on:
  push:
    branches:
      - codex/pocket-potna-demonic-unified-core-20261002
    paths:
      - "android/demonic-ai-studio-hub/**"
      - ".github/workflows/build-demonic-unified-apk.yml"
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build unified debug APK
        working-directory: android/demonic-ai-studio-hub
        run: gradle --stacktrace :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/demonic-ai-studio-hub/app/build/outputs/apk/debug/app-debug.apk dist/FME-Demonic-Unified-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FME-Demonic-Unified-APK
          path: dist/FME-Demonic-Unified-debug.apk
          if-no-files-found: error
