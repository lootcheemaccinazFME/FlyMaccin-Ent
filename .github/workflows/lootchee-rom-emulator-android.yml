name: LOOTCHEE ROM Emulator Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - build/fme-everything-one-apk-v1
    paths:
      - 'android/lootchee-rom-emulator/**'
      - '.github/workflows/lootchee-rom-emulator-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android/lootchee-rom-emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Inspect Gradle entrypoint
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "::warning::Project Gradle wrapper is incomplete; using pinned Gradle 8.9 from setup-gradle"
            command -v gradle
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi
      - name: Acquire Android arm64 Libretro cores
        shell: bash
        run: |
          set -euo pipefail
          DEST=app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          for core in sameboy dosbox_pure; do
            name="${core}_libretro_android.so"
            url="https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${name}.zip"
            echo "Fetching $name from Libretro buildbot"
            curl --fail --location --retry 3 --retry-delay 3 --output "/tmp/${name}.zip" "$url"
            entry=$(unzip -Z1 "/tmp/${name}.zip" | grep -E "(^|/)${name}$" | head -n 1)
            test -n "$entry"
            unzip -p "/tmp/${name}.zip" "$entry" > "$DEST/lib$name"
            test -s "$DEST/lib$name"
            file "$DEST/lib$name"
            readelf -h "$DEST/lib$name" | grep -q 'AArch64'
            sha256sum "$DEST/lib$name"
          done
      - name: Check project configuration
        run: $GRADLE_CMD --no-daemon projects
      - name: Compile native code and assemble APK
        run: $GRADLE_CMD --no-daemon :app:assembleDebug
      - name: Run available unit tests
        run: $GRADLE_CMD --no-daemon :app:testDebugUnitTest
      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep -q "lib/arm64-v8a/libsameboy_libretro_android.so"
          unzip -Z1 "$APK" | grep -q "lib/arm64-v8a/libdosbox_pure_libretro_android.so"
          unzip -Z1 "$APK" | grep -q "lib/arm64-v8a/liblootchee_frontend.so"
          sha256sum "$APK" > "$APK.sha256"
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: lootchee-rom-emulator-debug-apk
          path: |
            android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk
            android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
