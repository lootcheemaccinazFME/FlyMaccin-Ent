name: LOOTCHEE ROM Emulator Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - build/fme-everything-one-apk-v1
    paths:
      - 'android/lootchee-rom-emulator/**'
      - '.github/workflows/lootchee-rom-emulator-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android/lootchee-rom-emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android toolchain
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Inspect Gradle entrypoint
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "::warning::Project Gradle wrapper is incomplete; using runner Gradle if installed"
            command -v gradle
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi
      - name: Compile native code and assemble APK
        run: $GRADLE_CMD --no-daemon :app:assembleDebug
      - name: Run available unit tests
        run: $GRADLE_CMD --no-daemon :app:testDebugUnitTest
      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" > "$APK.sha256"
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: lootchee-rom-emulator-debug-apk
          path: |
            android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk
            android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
