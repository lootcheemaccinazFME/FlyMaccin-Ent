name: LOOTCHEE ROM Emulator Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - build/fme-everything-one-apk-v1
    paths:
      - 'android/lootchee-rom-emulator/**'
      - '.github/workflows/lootchee-rom-emulator-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: android/lootchee-rom-emulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and repair corrupted NDK downloads
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1"
          NDK="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          for attempt in 1 2 3; do
            if [ -f "$NDK/source.properties" ] && grep -q '27.0.12077973' "$NDK/source.properties"; then
              echo "Verified NDK 27.0.12077973"
              break
            fi
            echo "::warning::NDK installation attempt $attempt of 3"
            rm -rf "$NDK"
            if sdkmanager --install "ndk;27.0.12077973" && [ -f "$NDK/source.properties" ]; then
              break
            fi
            rm -rf "$NDK"
            sleep $((attempt * 15))
          done
          test -f "$NDK/source.properties"
          grep -q '27.0.12077973' "$NDK/source.properties"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          echo "NDK archive extracted and compiler verified"
      - name: Inspect Gradle entrypoint
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            chmod +x ./gradlew
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "::warning::Project Gradle wrapper is incomplete; using pinned Gradle 8.9 from setup-gradle"
            command -v gradle
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi
      - name: Acquire and verify foundation cores for both Android ABIs
        shell: bash
        run: |
          set -euo pipefail
          cores=(sameboy dosbox_pure)
          for abi in arm64-v8a x86_64; do
            dest="app/src/main/jniLibs/$abi"
            mkdir -p "$dest"
            for core in "${cores[@]}"; do
              name="${core}_libretro_android.so"
              archive="/tmp/${abi}_${name}.zip"
              url="https://buildbot.libretro.com/nightly/android/latest/$abi/${name}.zip"
              curl --fail --location --retry 3 --retry-delay 3 --output "$archive" "$url"
              unzip -Z1 "$archive" > "/tmp/${abi}_${name}.entries"
              entry=$(grep -E "(^|/)${name}$" "/tmp/${abi}_${name}.entries" | head -n 1)
              test -n "$entry"
              unzip -p "$archive" "$entry" > "$dest/lib$name"
              test -s "$dest/lib$name"
              readelf -h "$dest/lib$name" > "/tmp/${abi}_${name}.elf"
              grep -q 'ELF64' "/tmp/${abi}_${name}.elf"
              case "$abi" in
                arm64-v8a) grep -q 'AArch64' "/tmp/${abi}_${name}.elf" ;;
                x86_64) grep -q 'Advanced Micro Devices X86-64' "/tmp/${abi}_${name}.elf" ;;
              esac
              sha256sum "$dest/lib$name"
            done
          done
      - name: Check project configuration
        run: $GRADLE_CMD --no-daemon projects
      - name: Compile native code and assemble APK
        run: $GRADLE_CMD --no-daemon :app:assembleDebug
      - name: Run available unit tests
        run: $GRADLE_CMD --no-daemon :app:testDebugUnitTest
      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" > /tmp/lootchee-apk-entries.txt
          for abi in arm64-v8a x86_64; do
            for core in sameboy dosbox_pure; do
              grep -Fxq "lib/$abi/lib${core}_libretro_android.so" /tmp/lootchee-apk-entries.txt
            done
            grep -Fxq "lib/$abi/liblootchee_frontend.so" /tmp/lootchee-apk-entries.txt
          done
          sha256sum "$APK" > "$APK.sha256"
          ls -lh "$APK"
      - name: Run real SameBoy and DOSBox Pure tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          working-directory: android/lootchee-rom-emulator
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lootchee-rom-emulator-debug-apk
          path: |
            android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk
            android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
