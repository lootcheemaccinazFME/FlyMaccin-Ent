name: Build Demonic AI Studio Hut APK

on:
  push:
    branches:
      - demonic-ai-studio-hut-v2.1.0
    paths:
      - '.github/workflows/build-demonic-ai-studio-hut.yml'
      - '.github/scripts/patch_demonic_mobile_multitask.py'
      - '.github/scripts/patch_restore_full_studio.py'
      - '.github/scripts/patch_studio_os_v213.py'
      - '.github/scripts/patch_browser_persistence_v214.py'
      - '.github/scripts/android_smoke_test.sh'
      - 'app/src/main/assets/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download verified unified source
        run: |
          curl -fL --retry 4 --retry-delay 2 'https://23ebafba-21dc-4d98-b518-e7a6c583500d.sandbox.floot.app/_cdn/static/ce309b52-f4c9-4896-bcb5-d15de2a73b83-Demonic_AI_Studio_Hut_v2.1.0_VERIFIED_SOURCE.zip' -o source.zip
          echo '23a19eae631789961b6818b87094743dfbbafccfd14ebf4f23b2713caee8e48b  source.zip' | sha256sum -c -
          unzip -q source.zip -d demonic-ai-studio-hut

      - name: Apply mobile multitasking patch
        run: python3 .github/scripts/patch_demonic_mobile_multitask.py demonic-ai-studio-hut

      - name: Merge full Book Writer and unified studio
        run: python3 .github/scripts/patch_restore_full_studio.py demonic-ai-studio-hut

      - name: Apply Studio OS v2.1.3 layer
        run: python3 .github/scripts/patch_studio_os_v213.py demonic-ai-studio-hut

      - name: Apply browser account persistence v2.1.4
        run: python3 .github/scripts/patch_browser_persistence_v214.py demonic-ai-studio-hut

      - name: Static validation
        run: |
          node --check demonic-ai-studio-hut/app/src/main/assets/app.js
          node --check demonic-ai-studio-hut/app/src/main/assets/studio_os.js
          node --check demonic-ai-studio-hut/app/src/main/assets/bookwriter/app.js
          test -f demonic-ai-studio-hut/app/src/main/assets/studio_os.css
          test -f demonic-ai-studio-hut/app/src/main/assets/bookwriter/index.html
          test -f demonic-ai-studio-hut/app/src/main/assets/bookwriter/core.mjs
          test -f demonic-ai-studio-hut/app/src/main/assets/bookwriter/houses.js
          grep -q 'Demonic AI Studio Hut' demonic-ai-studio-hut/app/src/main/res/values/strings.xml
          grep -q 'versionName = "2.1.4"' demonic-ai-studio-hut/app/build.gradle.kts
          grep -q 'versionCode = 214' demonic-ai-studio-hut/app/build.gradle.kts
          grep -q 'android:resizeableActivity="true"' demonic-ai-studio-hut/app/src/main/AndroidManifest.xml
          grep -q 'android:supportsPictureInPicture="true"' demonic-ai-studio-hut/app/src/main/AndroidManifest.xml
          grep -q 'BackgroundPlaybackService' demonic-ai-studio-hut/app/src/main/AndroidManifest.xml
          grep -q 'Add to Home Screen' demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/MainActivity.java
          grep -q 'Split Screen' demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/MainActivity.java
          grep -q 'Picture in Picture Now' demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/MainActivity.java
          grep -q 'Demonic Studio OS' demonic-ai-studio-hut/app/src/main/assets/studio_os.js
          grep -q 'Universal Send To pipeline' demonic-ai-studio-hut/app/src/main/assets/studio_os.js
          grep -q 'Autosave/version snapshots/crash recovery' demonic-ai-studio-hut/app/src/main/assets/studio_os.js
          grep -q 'studio_os.js' demonic-ai-studio-hut/app/src/main/assets/index.html
          grep -q 'DEMONIC_BROWSER_PERSISTENCE_V214' demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/BrowserActivity.java
          grep -q 'setAcceptCookie(true)' demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/BrowserActivity.java
          grep -q 'setAcceptThirdPartyCookies' demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/BrowserActivity.java
          grep -q 'setDomStorageEnabled(true)' demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/BrowserActivity.java
          grep -q 'CookieManager.getInstance().flush()' demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/BrowserActivity.java
          test -f demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/BackgroundPlaybackService.java
          test -f demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/BrowserActivity.java
          test -f demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/BookwriterBridge.java
          for room in 'Book Writer' 'Creator AI' 'Demonic DAW' 'Scripture Writer' 'Game Maker' 'Development Room' 'Beat Maker' 'Tools' 'FME Library' 'Audit Archive' 'Settings'; do
            grep -q "$room" demonic-ai-studio-hut/app/src/main/assets/app.js || { echo "Missing room in merged app.js: $room"; exit 1; }
          done
          grep -q 'FME BOOKWRITER OPENAI STUDIOS' demonic-ai-studio-hut/app/src/main/assets/bookwriter/index.html
          grep -q 'Book Planning Command Center' demonic-ai-studio-hut/app/src/main/assets/bookwriter/index.html
          grep -q 'Story Bible / Continuity Authority' demonic-ai-studio-hut/app/src/main/assets/bookwriter/index.html

      - name: Build debug APK
        run: gradle -p demonic-ai-studio-hut :app:assembleDebug --stacktrace

      - name: APK structural and room smoke test
        run: |
          APK='demonic-ai-studio-hut/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/studio_os.js'
          unzip -l "$APK" | grep -q 'assets/studio_os.css'
          unzip -l "$APK" | grep -q 'assets/bookwriter/index.html'
          unzip -l "$APK" | grep -q 'assets/bookwriter/core.mjs'
          unzip -l "$APK" | grep -q 'assets/bookwriter/houses.js'
          unzip -p "$APK" assets/app.js > packaged-app.js
          unzip -p "$APK" assets/studio_os.js > packaged-studio-os.js
          for room in 'Book Writer' 'Creator AI' 'Demonic DAW' 'Scripture Writer' 'Game Maker' 'Development Room' 'Beat Maker' 'Tools' 'FME Library' 'Audit Archive' 'Settings'; do
            grep -q "$room" packaged-app.js || { echo "Missing room from packaged APK: $room"; exit 1; }
          done
          grep -q 'Demonic Studio OS' packaged-studio-os.js
          grep -q 'Universal Send To pipeline' packaged-studio-os.js
          unzip -p "$APK" assets/bookwriter/index.html | grep -q 'Book Planning Command Center'
          cp "$APK" Demonic_AI_Studio_Hut_v2.1.4_BROWSER_PERSISTENCE-debug.apk
          sha256sum Demonic_AI_Studio_Hut_v2.1.4_BROWSER_PERSISTENCE-debug.apk > Demonic_AI_Studio_Hut_v2.1.4_BROWSER_PERSISTENCE-debug.apk.sha256

      - name: Upload compiled APK before runtime QA
        uses: actions/upload-artifact@v4
        with:
          name: Demonic-AI-Studio-Hut-v2.1.4-BROWSER-PERSISTENCE-debug
          path: |
            Demonic_AI_Studio_Hut_v2.1.4_BROWSER_PERSISTENCE-debug.apk
            Demonic_AI_Studio_Hut_v2.1.4_BROWSER_PERSISTENCE-debug.apk.sha256
          if-no-files-found: error

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm
          else
            echo 'KVM is not exposed on this runner.'
          fi

      - name: Android install and launch runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: sh .github/scripts/android_smoke_test.sh

      - name: Capture fallback QA diagnostics
        if: always()
        timeout-minutes: 1
        run: |
          timeout 10 adb devices -l > adb-devices.txt 2>/dev/null || true
          timeout 10 adb logcat -d > logcat-final.txt 2>/dev/null || true
          timeout 10 adb shell dumpsys activity activities > activity-final.txt 2>/dev/null || true
          timeout 10 adb shell dumpsys package com.flymaccin.pocketpotna > package-final.txt 2>/dev/null || true
          test -f emulator-smoke-report.txt || echo 'Runtime smoke test did not reach app launch.' > emulator-smoke-report.txt

      - name: Upload emulator QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Demonic-AI-Studio-Hut-v2.1.4-BROWSER-PERSISTENCE-emulator-QA
          path: |
            emulator-smoke-report.txt
            adb-devices.txt
            logcat.txt
            logcat-final.txt
            activity-final.txt
            package-final.txt
            fatal-app.txt
          if-no-files-found: warn
