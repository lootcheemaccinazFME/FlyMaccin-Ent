name: Build Demonic AI Studio Hut APK

on:
  push:
    branches:
      - demonic-ai-studio-hut-v2.1.0
    paths:
      - '.github/workflows/build-demonic-ai-studio-hut.yml'
      - '.github/scripts/patch_demonic_mobile_multitask.py'
      - '.github/scripts/android_smoke_test.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download verified unified source
        run: |
          curl -fL --retry 4 --retry-delay 2 'https://23ebafba-21dc-4d98-b518-e7a6c583500d.sandbox.floot.app/_cdn/static/ce309b52-f4c9-4896-bcb5-d15de2a73b83-Demonic_AI_Studio_Hut_v2.1.0_VERIFIED_SOURCE.zip' -o source.zip
          echo '23a19eae631789961b6818b87094743dfbbafccfd14ebf4f23b2713caee8e48b  source.zip' | sha256sum -c -
          unzip -q source.zip -d demonic-ai-studio-hut

      - name: Apply mobile multitasking patch
        run: python3 .github/scripts/patch_demonic_mobile_multitask.py demonic-ai-studio-hut

      - name: Static validation
        run: |
          node --check demonic-ai-studio-hut/app/src/main/assets/app.js
          grep -q 'Demonic AI Studio Hut' demonic-ai-studio-hut/app/src/main/res/values/strings.xml
          grep -q 'versionName = "2.1.1"' demonic-ai-studio-hut/app/build.gradle.kts
          grep -q 'android:resizeableActivity="true"' demonic-ai-studio-hut/app/src/main/AndroidManifest.xml
          grep -q 'android:supportsPictureInPicture="true"' demonic-ai-studio-hut/app/src/main/AndroidManifest.xml
          grep -q 'BackgroundPlaybackService' demonic-ai-studio-hut/app/src/main/AndroidManifest.xml
          grep -q 'Add to Home Screen' demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/MainActivity.java
          grep -q 'Split Screen' demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/MainActivity.java
          grep -q 'Picture in Picture Now' demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/MainActivity.java
          test -f demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/BackgroundPlaybackService.java
          test -f demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/BrowserActivity.java
          test -f demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/BookwriterBridge.java

      - name: Build debug APK
        run: gradle -p demonic-ai-studio-hut :app:assembleDebug --stacktrace

      - name: APK structural smoke test
        run: |
          APK='demonic-ai-studio-hut/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" Demonic_AI_Studio_Hut_v2.1.1-debug.apk
          sha256sum Demonic_AI_Studio_Hut_v2.1.1-debug.apk > Demonic_AI_Studio_Hut_v2.1.1-debug.apk.sha256

      - name: Upload compiled APK before runtime QA
        uses: actions/upload-artifact@v4
        with:
          name: Demonic-AI-Studio-Hut-v2.1.1-debug
          path: |
            Demonic_AI_Studio_Hut_v2.1.1-debug.apk
            Demonic_AI_Studio_Hut_v2.1.1-debug.apk.sha256
          if-no-files-found: error

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm || true
            sudo chmod 666 /dev/kvm || true
            ls -l /dev/kvm
          else
            echo 'KVM is not exposed on this runner.'
          fi

      - name: Android install and launch runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: sh .github/scripts/android_smoke_test.sh

      - name: Capture fallback QA diagnostics
        if: always()
        timeout-minutes: 1
        run: |
          timeout 10 adb devices -l > adb-devices.txt 2>/dev/null || true
          timeout 10 adb logcat -d > logcat-final.txt 2>/dev/null || true
          timeout 10 adb shell dumpsys activity activities > activity-final.txt 2>/dev/null || true
          timeout 10 adb shell dumpsys package com.flymaccin.pocketpotna > package-final.txt 2>/dev/null || true
          test -f emulator-smoke-report.txt || echo 'Runtime smoke test did not reach app launch.' > emulator-smoke-report.txt

      - name: Upload emulator QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Demonic-AI-Studio-Hut-v2.1.1-emulator-QA
          path: |
            emulator-smoke-report.txt
            adb-devices.txt
            logcat.txt
            logcat-final.txt
            activity-final.txt
            package-final.txt
            fatal-app.txt
          if-no-files-found: warn
