name: Build Demonic AI Studio Hut APK

on:
  push:
    branches:
      - demonic-ai-studio-hut-v2.1.0
    paths:
      - '.github/workflows/build-demonic-ai-studio-hut.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download verified unified source
        run: |
          curl -fL --retry 4 --retry-delay 2 'https://23ebafba-21dc-4d98-b518-e7a6c583500d.sandbox.floot.app/_cdn/static/ce309b52-f4c9-4896-bcb5-d15de2a73b83-Demonic_AI_Studio_Hut_v2.1.0_VERIFIED_SOURCE.zip' -o source.zip
          echo '23a19eae631789961b6818b87094743dfbbafccfd14ebf4f23b2713caee8e48b  source.zip' | sha256sum -c -
          unzip -q source.zip -d demonic-ai-studio-hut

      - name: Static validation
        run: |
          node --check demonic-ai-studio-hut/app/src/main/assets/app.js
          grep -q 'Demonic AI Studio Hut' demonic-ai-studio-hut/app/src/main/res/values/strings.xml
          grep -q 'versionName = "2.1.0"' demonic-ai-studio-hut/app/build.gradle.kts
          test -f demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/BrowserActivity.java
          test -f demonic-ai-studio-hut/app/src/main/java/com/flymaccin/bookwriter/BookwriterBridge.java

      - name: Build debug APK
        run: gradle -p demonic-ai-studio-hut :app:assembleDebug --stacktrace

      - name: APK structural smoke test
        run: |
          APK='demonic-ai-studio-hut/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          cp "$APK" Demonic_AI_Studio_Hut_v2.1.0-debug.apk
          sha256sum Demonic_AI_Studio_Hut_v2.1.0-debug.apk > Demonic_AI_Studio_Hut_v2.1.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Demonic-AI-Studio-Hut-v2.1.0-debug
          path: |
            Demonic_AI_Studio_Hut_v2.1.0-debug.apk
            Demonic_AI_Studio_Hut_v2.1.0-debug.apk.sha256
          if-no-files-found: error
