name: Phantom Core Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'phantom-core/**'
      - '.github/workflows/phantom-core-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify staged source chunks
        shell: bash
        run: |
          set -euo pipefail
          cd phantom-core
          echo 'c9aa90fe3d73ff1d84ee8225a6be32904611c9594076213d700a66a128a715f4  source.b64.part-00' | sha256sum -c -
          echo '384a79307e3d9dc15dcf6b2a66f0c8168433eac08087c6eebb1b50b085f1759d  source.b64.part-01' | sha256sum -c -
          echo '6c32ee1d6f1a8cf8b647807dacd660f15b91a5f0c9c77cc3ad06aac182cf7009  source.b64.part-02' | sha256sum -c -
          echo '057c58a8c7cb7b0418ca88c5cb7d7da743ef0b04ae9f8b04b60ececc5880725f  source.b64.part-03' | sha256sum -c -
          echo 'b51807d2ce9790851c7b3efb726755d05e3b1bf5811ae981a2e2c697d416ce1f  source.b64.part-04' | sha256sum -c -
          echo '5dba306d24eba69e720919b6acf6c56bd02781e2935af894ffae974715391a66  source.b64.part-05' | sha256sum -c -
          echo '462ea0a1a5450902abd1537990b5647c7303625473ed56900559cb31af30168e  source.b64.part-06x0' | sha256sum -c -
          echo '854541b4600d19cbcd3109745d98f9fadd0122cdc8215b56716f9ec237a1150a  source.b64.part-06x1' | sha256sum -c -
          echo 'a583f21035d8284b18e5fc3ea049fe13e79161bd91c0dcf22923c032bec3923d  source.b64.part-06x2' | sha256sum -c -

      - name: Reconstruct verified v0.7 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            phantom-core/source.b64.part-00 \
            phantom-core/source.b64.part-01 \
            phantom-core/source.b64.part-02 \
            phantom-core/source.b64.part-03 \
            phantom-core/source.b64.part-04 \
            phantom-core/source.b64.part-05 \
            phantom-core/source.b64.part-06x0 \
            phantom-core/source.b64.part-06x1 \
            phantom-core/source.b64.part-06x2 \
            > phantom-core/source.b64
          base64 --decode phantom-core/source.b64 > phantom-core/source.zip
          echo '278813f4b2e11d6af38ed3816e1cc3885cbeede49e6afc11d868a0172400ede2  phantom-core/source.zip' | sha256sum -c -
          mkdir -p phantom-core/build
          unzip -q phantom-core/source.zip -d phantom-core/build
          test -f phantom-core/build/PhantomCoreAndroid/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test and build debug APK
        working-directory: phantom-core/build/PhantomCoreAndroid
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload Phantom Core debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhantomCore-v0.7.0-debug-apk
          path: |
            phantom-core/build/PhantomCoreAndroid/app/build/outputs/apk/debug/app-debug.apk
            phantom-core/build/PhantomCoreAndroid/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
