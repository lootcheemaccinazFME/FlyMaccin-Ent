name: MaccinAzz Phase 7 Compiler Gate

on:
  push:
    branches: [ phase7-compiler-gate ]
    paths:
      - '.github/workflows/phase7-compiler-gate.yml'
      - '.github/scripts/phase7-smoke.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_ZIP_URL: https://6695b8fc-4876-4314-857d-5c694b0de995.sandbox.floot.app/_cdn/static/e92b37c5-a0d0-447f-9f92-956954e97aac-MaccinAzz_GameOS_Demonic_FME_Phase7_R7_COMPILER_GATE.zip
      EXPECTED_PACKAGE: com.flymaccin.creatoros
      EXPECTED_VERSION: 0.7.0-phase7

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35 and build tools
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download exact Phase 7 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$SOURCE_ZIP_URL" -o /tmp/phase7.zip
          test -s /tmp/phase7.zip
          unzip -tq /tmp/phase7.zip
          rm -rf /tmp/phase7src
          mkdir -p /tmp/phase7src
          unzip -q /tmp/phase7.zip -d /tmp/phase7src
          root=$(find /tmp/phase7src -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$root"
          echo "PROJECT_ROOT=$root" >> "$GITHUB_ENV"
          test -f "$root/settings.gradle.kts"
          test -f "$root/app/build.gradle.kts"
          test -f "$root/app/src/main/AndroidManifest.xml"
          cp /tmp/phase7.zip "$GITHUB_WORKSPACE/phase7-source-input.zip"

      - name: Real Android compile
        id: compile
        shell: bash
        run: |
          set +e
          cd "$PROJECT_ROOT"
          gradle --no-daemon :app:assembleDebug --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect APK
        if: steps.compile.outputs.code == '0'
        shell: bash
        run: |
          set -euo pipefail
          apk="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/MaccinAzzOS-Phase7-debug.apk"

      - name: Verify APK structure and metadata
        if: steps.compile.outputs.code == '0'
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/MaccinAzzOS-Phase7-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -s "$apk"
          unzip -tq "$apk"
          "$ZIPALIGN" -c -v 4 "$apk" | tee "$GITHUB_WORKSPACE/apk-zipalign.txt"
          "$AAPT" dump badging "$apk" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "package: name='$EXPECTED_PACKAGE'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionName='$EXPECTED_VERSION'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "launchable-activity:" "$GITHUB_WORKSPACE/apk-badging.txt"
          "$AAPT" dump xmltree "$apk" AndroidManifest.xml > "$GITHUB_WORKSPACE/apk-manifest.txt"
          grep -q "android.intent.action.MAIN" "$GITHUB_WORKSPACE/apk-manifest.txt"
          "$APKSIGNER" verify --verbose --print-certs "$apk" | tee "$GITHUB_WORKSPACE/apk-signature.txt"
          sha256sum "$apk" | tee "$GITHUB_WORKSPACE/apk-sha256.txt"

      - name: Enable KVM acceleration
        if: steps.compile.outputs.code == '0'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Android install and smoke test
        if: steps.compile.outputs.code == '0'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/phase7-smoke.sh

      - name: Upload compiler and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-final-debug-evidence
          if-no-files-found: warn
          path: |
            build.log
            apk-badging.txt
            apk-manifest.txt
            apk-signature.txt
            apk-sha256.txt
            apk-zipalign.txt
            MaccinAzzOS-Phase7-debug.apk
            phase7-source-input.zip
            adb-install.txt
            launch-first.txt
            launch-reopen.txt
            smoke-logcat.txt
            smoke-summary.txt
            room-before.txt
            room-after.txt
            ui-home.xml
            ui-personas.xml
            ui-haha.xml
            ui-home-before-reopen.xml
            ui-reopen.xml
            ui-home-scrolled.xml
            ui-ai.xml

      - name: Enforce compiler gate
        if: steps.compile.outputs.code != '0'
        run: exit 1
