name: MaccinAzz Phase 7 Compiler Gate

on:
  push:
    branches: [ phase7-compiler-gate ]
    paths:
      - '.github/workflows/phase7-compiler-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_ZIP_URL: https://6695b8fc-4876-4314-857d-5c694b0de995.sandbox.floot.app/_cdn/static/e92b37c5-a0d0-447f-9f92-956954e97aac-MaccinAzz_GameOS_Demonic_FME_Phase7_R7_COMPILER_GATE.zip
      EXPECTED_PACKAGE: com.flymaccin.creatoros
      EXPECTED_VERSION: 0.7.0-phase7
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 35 and build tools
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download exact Phase 7 source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$SOURCE_ZIP_URL" -o /tmp/phase7.zip
          test -s /tmp/phase7.zip
          unzip -tq /tmp/phase7.zip
          rm -rf /tmp/phase7src
          mkdir -p /tmp/phase7src
          unzip -q /tmp/phase7.zip -d /tmp/phase7src
          root=$(find /tmp/phase7src -mindepth 1 -maxdepth 1 -type d | head -1)
          test -n "$root"
          echo "PROJECT_ROOT=$root" >> "$GITHUB_ENV"
          test -f "$root/settings.gradle.kts"
          test -f "$root/app/build.gradle.kts"
          test -f "$root/app/src/main/AndroidManifest.xml"
          cp /tmp/phase7.zip "$GITHUB_WORKSPACE/phase7-source-input.zip"

      - name: Real Android compile
        id: compile
        shell: bash
        run: |
          set +e
          cd "$PROJECT_ROOT"
          gradle --no-daemon :app:assembleDebug --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect APK
        if: steps.compile.outputs.code == '0'
        shell: bash
        run: |
          set -euo pipefail
          apk="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/MaccinAzzOS-Phase7-debug.apk"

      - name: Verify APK structure and metadata
        if: steps.compile.outputs.code == '0'
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/MaccinAzzOS-Phase7-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -s "$apk"
          unzip -tq "$apk"
          "$ZIPALIGN" -c -v 4 "$apk" | tee "$GITHUB_WORKSPACE/apk-zipalign.txt"
          "$AAPT" dump badging "$apk" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "package: name='$EXPECTED_PACKAGE'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -F "versionName='$EXPECTED_VERSION'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "launchable-activity:" "$GITHUB_WORKSPACE/apk-badging.txt"
          "$AAPT" dump xmltree "$apk" AndroidManifest.xml > "$GITHUB_WORKSPACE/apk-manifest.txt"
          grep -q "android.intent.action.MAIN" "$GITHUB_WORKSPACE/apk-manifest.txt"
          "$APKSIGNER" verify --verbose --print-certs "$apk" | tee "$GITHUB_WORKSPACE/apk-signature.txt"
          sha256sum "$apk" | tee "$GITHUB_WORKSPACE/apk-sha256.txt"

      - name: Enable KVM acceleration
        if: steps.compile.outputs.code == '0'
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Android install and smoke test
        if: steps.compile.outputs.code == '0'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            APK="$GITHUB_WORKSPACE/MaccinAzzOS-Phase7-debug.apk"
            PKG="$EXPECTED_PACKAGE"
            adb install -r "$APK" | tee "$GITHUB_WORKSPACE/adb-install.txt"
            grep -q 'Success' "$GITHUB_WORKSPACE/adb-install.txt"
            adb logcat -c
            adb shell am start -W -n "$PKG/.MainActivity" | tee "$GITHUB_WORKSPACE/launch-first.txt"
            sleep 6
            adb shell pidof "$PKG" | tee "$GITHUB_WORKSPACE/pid-first.txt"
            test -s "$GITHUB_WORKSPACE/pid-first.txt"

            dump_ui() {
              local out="$1"
              for i in $(seq 1 8); do
                adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
                adb pull /sdcard/window.xml "$out" >/dev/null 2>&1 || true
                if [ -s "$out" ]; then return 0; fi
                sleep 1
              done
              return 1
            }

            tap_text() {
              local xml="$1"; shift
              local label="$*"
              local xy
              xy=$(python3 - "$xml" "$label" <<'PY'
            import re, sys, xml.etree.ElementTree as ET
            path, label = sys.argv[1], sys.argv[2]
            root = ET.parse(path).getroot()
            candidates=[]
            for n in root.iter('node'):
                text=(n.attrib.get('text') or '').strip()
                desc=(n.attrib.get('content-desc') or '').strip()
                if label == text or label == desc or label in text or label in desc:
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib.get('bounds',''))
                    if m:
                        x1,y1,x2,y2=map(int,m.groups())
                        candidates.append(((x2-x1)*(y2-y1),(x1+x2)//2,(y1+y2)//2))
            if not candidates:
                raise SystemExit(2)
            _,x,y=max(candidates)
            print(x,y)
            PY
              )
              adb shell input tap $xy
              sleep 3
            }

            dump_ui "$GITHUB_WORKSPACE/ui-home.xml"
            grep -Fq 'MACCIN AZZ GAME / OS' "$GITHUB_WORKSPACE/ui-home.xml"
            tap_text "$GITHUB_WORKSPACE/ui-home.xml" 'Persona Operating Systems'
            dump_ui "$GITHUB_WORKSPACE/ui-personas.xml"
            grep -Fq 'MACCIN AZZ PERSONA OS' "$GITHUB_WORKSPACE/ui-personas.xml"
            grep -Fq 'HAHAMaccin AzzOS' "$GITHUB_WORKSPACE/ui-personas.xml"
            tap_text "$GITHUB_WORKSPACE/ui-personas.xml" 'HAHAMaccin AzzOS'
            dump_ui "$GITHUB_WORKSPACE/ui-haha.xml"
            grep -Fq 'HAHAMaccin AzzOS' "$GITHUB_WORKSPACE/ui-haha.xml"
            grep -Fq 'Persona task' "$GITHUB_WORKSPACE/ui-haha.xml"
            adb shell pidof "$PKG" > "$GITHUB_WORKSPACE/pid-persona.txt"
            test -s "$GITHUB_WORKSPACE/pid-persona.txt"

            adb shell input keyevent 4
            sleep 2
            adb shell input keyevent 4
            sleep 3
            dump_ui "$GITHUB_WORKSPACE/ui-home-before-reopen.xml"
            grep -Fq 'MACCIN AZZ GAME / OS' "$GITHUB_WORKSPACE/ui-home-before-reopen.xml"

            adb exec-out run-as "$PKG" ls -l databases | tee "$GITHUB_WORKSPACE/room-before.txt"
            grep -Fq 'flymaccin_creator_os.db' "$GITHUB_WORKSPACE/room-before.txt"
            adb exec-out run-as "$PKG" cat databases/flymaccin_creator_os.db > "$GITHUB_WORKSPACE/room-before.db"
            test -s "$GITHUB_WORKSPACE/room-before.db"

            adb shell am force-stop "$PKG"
            sleep 2
            adb shell am start -W -n "$PKG/.MainActivity" | tee "$GITHUB_WORKSPACE/launch-reopen.txt"
            sleep 6
            adb shell pidof "$PKG" | tee "$GITHUB_WORKSPACE/pid-reopen.txt"
            test -s "$GITHUB_WORKSPACE/pid-reopen.txt"
            dump_ui "$GITHUB_WORKSPACE/ui-reopen.xml"
            grep -Fq 'MACCIN AZZ GAME / OS' "$GITHUB_WORKSPACE/ui-reopen.xml"
            adb exec-out run-as "$PKG" ls -l databases | tee "$GITHUB_WORKSPACE/room-after.txt"
            grep -Fq 'flymaccin_creator_os.db' "$GITHUB_WORKSPACE/room-after.txt"
            adb exec-out run-as "$PKG" cat databases/flymaccin_creator_os.db > "$GITHUB_WORKSPACE/room-after.db"
            test -s "$GITHUB_WORKSPACE/room-after.db"

            adb shell input swipe 500 1400 500 500 250 || true
            sleep 2
            dump_ui "$GITHUB_WORKSPACE/ui-home-scrolled.xml"
            tap_text "$GITHUB_WORKSPACE/ui-home-scrolled.xml" 'AI Runtime'
            dump_ui "$GITHUB_WORKSPACE/ui-ai.xml"
            grep -Eq 'AI Studio|Prompt Compiler|AI Runtime' "$GITHUB_WORKSPACE/ui-ai.xml"
            adb shell pidof "$PKG" > "$GITHUB_WORKSPACE/pid-ai.txt"
            test -s "$GITHUB_WORKSPACE/pid-ai.txt"

            adb logcat -d -v threadtime > "$GITHUB_WORKSPACE/smoke-logcat.txt"
            if grep -E 'FATAL EXCEPTION|Process: com\.flymaccin\.creatoros.*has died|Force finishing activity.*com\.flymaccin\.creatoros' "$GITHUB_WORKSPACE/smoke-logcat.txt"; then
              echo 'Fatal app crash detected during smoke test' >&2
              exit 1
            fi
            echo 'PASS: install, launch, Persona OS, HaHa workspace, Room persistence, reopen, and AI no-credential screen smoke checks' | tee "$GITHUB_WORKSPACE/smoke-summary.txt"

      - name: Upload compiler and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-final-debug-evidence
          if-no-files-found: warn
          path: |
            build.log
            apk-badging.txt
            apk-manifest.txt
            apk-signature.txt
            apk-sha256.txt
            apk-zipalign.txt
            MaccinAzzOS-Phase7-debug.apk
            phase7-source-input.zip
            adb-install.txt
            launch-first.txt
            launch-reopen.txt
            smoke-logcat.txt
            smoke-summary.txt
            room-before.txt
            room-after.txt
            ui-home.xml
            ui-personas.xml
            ui-haha.xml
            ui-reopen.xml
            ui-ai.xml

      - name: Enforce compiler gate
        if: steps.compile.outputs.code != '0'
        run: exit 1
