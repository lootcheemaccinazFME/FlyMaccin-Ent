name: Demonic DAW Signed Release
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Release label
        required: false
        default: native-audio-rc
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify signing secrets
        env:
          KS: ${{ secrets.DEMONIC_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.DEMONIC_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.DEMONIC_KEY_ALIAS }}
          KP: ${{ secrets.DEMONIC_KEY_PASSWORD }}
        run: |
          test -n "$KS" || (echo 'Missing DEMONIC_KEYSTORE_BASE64' && exit 1)
          test -n "$KSP" || (echo 'Missing DEMONIC_KEYSTORE_PASSWORD' && exit 1)
          test -n "$KA" || (echo 'Missing DEMONIC_KEY_ALIAS' && exit 1)
          test -n "$KP" || (echo 'Missing DEMONIC_KEY_PASSWORD' && exit 1)
      - name: Restore release keystore
        env:
          KS: ${{ secrets.DEMONIC_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/demonic-release.jks"
      - name: Generate bundled Demonic Factory samples
        run: python3 .github/scripts/generate_demonic_factory.py
      - name: Configure Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'cmake;3.22.1' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build signed APK and Play AAB
        working-directory: demonic-daw
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          DEMONIC_KEYSTORE_PATH: ${{ runner.temp }}/demonic-release.jks
          DEMONIC_KEYSTORE_PASSWORD: ${{ secrets.DEMONIC_KEYSTORE_PASSWORD }}
          DEMONIC_KEY_ALIAS: ${{ secrets.DEMONIC_KEY_ALIAS }}
          DEMONIC_KEY_PASSWORD: ${{ secrets.DEMONIC_KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --stacktrace
      - name: Verify APK signature
        run: $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose demonic-daw/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: demonic-daw-signed-release
          path: |
            demonic-daw/app/build/outputs/apk/release/app-release.apk
            demonic-daw/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
