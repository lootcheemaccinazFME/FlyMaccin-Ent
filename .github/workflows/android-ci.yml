name: FME Android CI
on:
  workflow_dispatch:
  push:
    branches: [ main, fme-agent ]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    if: ${{ hashFiles('gradlew') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x ./gradlew
      - name: Unit tests
        run: ./gradlew test --stacktrace
      - name: Android lint
        run: ./gradlew lint --stacktrace
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: fme-debug-apk-${{ github.sha }}
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
  no-android-project:
    if: ${{ hashFiles('gradlew') == '' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "FME Agent is installed, but no Gradle wrapper exists yet."
          echo "Create/import the native Android project before APK compilation can run."
