name: Build Demonic DAW APK

on:
  push:
    branches:
      - demonic-daw-apk
    paths:
      - 'demonic-daw-android/**'
      - '.github/workflows/demonic-daw-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p demonic-daw-android :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp demonic-daw-android/app/build/outputs/apk/debug/app-debug.apk Demonic_DAW_v1.0.0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Demonic-DAW-v1.0.0-debug
          path: Demonic_DAW_v1.0.0-debug.apk
          if-no-files-found: error
