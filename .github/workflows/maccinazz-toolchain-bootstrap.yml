name: MaccinAzz Android Toolchain Bootstrap

on:
  push:
    branches: [maccinazz-phase7-apk-build]
    paths:
      - '.github/workflows/maccinazz-toolchain-bootstrap.yml'
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Create dependency warmup project
        run: |
          rm -rf /tmp/maccin-warmup
          mkdir -p /tmp/maccin-warmup/app/src/main/java/com/flymaccin/warmup
          mkdir -p /tmp/maccin-warmup/app/src/main
          cat > /tmp/maccin-warmup/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MaccinWarmup"
          include(":app")
          EOF
          cat > /tmp/maccin-warmup/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
              id("com.google.devtools.ksp") version "2.0.21-1.0.28" apply false
          }
          EOF
          cat > /tmp/maccin-warmup/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
              id("com.google.devtools.ksp")
          }
          android {
              namespace = "com.flymaccin.warmup"
              compileSdk = 35
              defaultConfig { applicationId = "com.flymaccin.warmup"; minSdk = 26; targetSdk = 35; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation(platform("androidx.compose:compose-bom:2024.11.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.navigation:navigation-compose:2.8.4")
              implementation("androidx.room:room-runtime:2.6.1")
              implementation("androidx.room:room-ktx:2.6.1")
              ksp("androidx.room:room-compiler:2.6.1")
              implementation("androidx.datastore:datastore-preferences:1.1.1")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("com.google.code.gson:gson:2.11.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              testImplementation("junit:junit:4.13.2")
              testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0")
              testImplementation("androidx.room:room-testing:2.6.1")
              debugImplementation("androidx.compose.ui:ui-tooling")
              debugImplementation("androidx.compose.ui:ui-test-manifest")
          }
          EOF
          cat > /tmp/maccin-warmup/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          mkdir -p /tmp/maccin-warmup/app/src/main/res/values
          cat > /tmp/maccin-warmup/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar"/></resources>
          EOF
          cat > /tmp/maccin-warmup/app/src/main/java/com/flymaccin/warmup/MainActivity.kt <<'EOF'
          package com.flymaccin.warmup
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.Text
          class MainActivity : ComponentActivity() { override fun onCreate(savedInstanceState: Bundle?) { super.onCreate(savedInstanceState); setContent { Text("warmup") } } }
          EOF

      - name: Warm Gradle and Maven caches
        working-directory: /tmp/maccin-warmup
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Package toolchain
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/export/gradle /tmp/export/android-sdk /tmp/export/gradle-home
          GRADLE_BIN="$(readlink -f "$(command -v gradle)")"
          GRADLE_ROOT="$(cd "$(dirname "$GRADLE_BIN")/.." && pwd)"
          tar -C "$(dirname "$GRADLE_ROOT")" -czf /tmp/export/gradle/gradle-8.9.tar.gz "$(basename "$GRADLE_ROOT")"
          tar -C "$ANDROID_HOME" -czf /tmp/export/android-sdk/android-sdk35.tar.gz \
            build-tools/35.0.0 platforms/android-35 platform-tools licenses
          tar -C "$HOME/.gradle" -czf /tmp/export/gradle-home/gradle-cache.tar.gz caches
          ls -lh /tmp/export/gradle/* /tmp/export/android-sdk/* /tmp/export/gradle-home/*

      - uses: actions/upload-artifact@v4
        with:
          name: maccin-gradle-8.9
          path: /tmp/export/gradle/gradle-8.9.tar.gz
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: maccin-android-sdk35
          path: /tmp/export/android-sdk/android-sdk35.tar.gz
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: maccin-gradle-cache
          path: /tmp/export/gradle-home/gradle-cache.tar.gz
          compression-level: 0
