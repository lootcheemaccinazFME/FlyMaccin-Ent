name: Build Demonic AI Studio Hut v2.1.7 Global Background

on:
  push:
    branches:
      - demonic-ai-studio-hut-v2.1.0
    paths:
      - '.github/workflows/build-demonic-background-v217.yml'
      - '.github/scripts/patch_demonic_mobile_multitask.py'
      - '.github/scripts/patch_restore_full_studio.py'
      - '.github/scripts/patch_studio_os_v213.py'
      - '.github/scripts/patch_browser_persistence_v214.py'
      - '.github/scripts/patch_rooms_game_v215.py'
      - '.github/scripts/patch_functional_core_v216.py'
      - '.github/scripts/patch_global_background_v217.py'
      - 'app/src/main/assets/functional_v216.js'
      - 'app/src/main/assets/functional_v216.css'
      - 'app/src/main/assets/fme_qr_hub_bg.jpg'
      - 'app/src/main/assets/global_background_v217.css'
      - '.github/scripts/android_smoke_test.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download verified source of record
        run: |
          curl -fL --retry 4 --retry-delay 2 'https://23ebafba-21dc-4d98-b518-e7a6c583500d.sandbox.floot.app/_cdn/static/ce309b52-f4c9-4896-bcb5-d15de2a73b83-Demonic_AI_Studio_Hut_v2.1.0_VERIFIED_SOURCE.zip' -o source.zip
          echo '23a19eae631789961b6818b87094743dfbbafccfd14ebf4f23b2713caee8e48b  source.zip' | sha256sum -c -
          unzip -q source.zip -d demonic-ai-studio-hut

      - name: Apply unified patches through v2.1.7
        run: |
          python3 .github/scripts/patch_demonic_mobile_multitask.py demonic-ai-studio-hut
          python3 .github/scripts/patch_restore_full_studio.py demonic-ai-studio-hut
          python3 .github/scripts/patch_studio_os_v213.py demonic-ai-studio-hut
          python3 .github/scripts/patch_browser_persistence_v214.py demonic-ai-studio-hut
          python3 .github/scripts/patch_rooms_game_v215.py demonic-ai-studio-hut
          python3 .github/scripts/patch_functional_core_v216.py demonic-ai-studio-hut
          python3 .github/scripts/patch_global_background_v217.py demonic-ai-studio-hut

      - name: Static functional validation
        run: |
          node --check demonic-ai-studio-hut/app/src/main/assets/app.js
          node --check demonic-ai-studio-hut/app/src/main/assets/studio_os.js
          node --check demonic-ai-studio-hut/app/src/main/assets/rooms_v215.js
          node --check demonic-ai-studio-hut/app/src/main/assets/functional_v216.js
          node --check demonic-ai-studio-hut/app/src/main/assets/bookwriter/app.js
          grep -q 'versionName = "2.1.7"' demonic-ai-studio-hut/app/build.gradle.kts
          grep -q 'versionCode = 217' demonic-ai-studio-hut/app/build.gradle.kts
          grep -q 'global_background_v217.css' demonic-ai-studio-hut/app/src/main/assets/index.html
          grep -q '../global_background_v217.css' demonic-ai-studio-hut/app/src/main/assets/bookwriter/index.html
          grep -q 'FME_GLOBAL_BACKGROUND_V217' demonic-ai-studio-hut/app/src/main/assets/global_background_v217.css
          grep -q 'fme_qr_hub_bg.jpg' demonic-ai-studio-hut/app/src/main/assets/global_background_v217.css
          test -s demonic-ai-studio-hut/app/src/main/assets/fme_qr_hub_bg.jpg
          grep -q 'functional_v216.js' demonic-ai-studio-hut/app/src/main/assets/index.html
          grep -q 'requestAnimationFrame(gameLoop)' demonic-ai-studio-hut/app/src/main/assets/rooms_v215.js
          grep -q 'Demonic AI Studio Hut' demonic-ai-studio-hut/app/src/main/res/values/strings.xml
          grep -q 'android:supportsPictureInPicture="true"' demonic-ai-studio-hut/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle -p demonic-ai-studio-hut :app:assembleDebug --stacktrace

      - name: Structural APK validation
        run: |
          APK='demonic-ai-studio-hut/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/fme_qr_hub_bg.jpg'
          unzip -l "$APK" | grep -q 'assets/global_background_v217.css'
          unzip -p "$APK" assets/global_background_v217.css > packaged-global-background-v217.css
          grep -q 'FME_GLOBAL_BACKGROUND_V217' packaged-global-background-v217.css
          unzip -p "$APK" assets/index.html | grep -q 'global_background_v217.css'
          unzip -p "$APK" assets/bookwriter/index.html | grep -q '../global_background_v217.css'
          cp "$APK" Demonic_AI_Studio_Hut_v2.1.7_GLOBAL_BACKGROUND-debug.apk
          sha256sum Demonic_AI_Studio_Hut_v2.1.7_GLOBAL_BACKGROUND-debug.apk > Demonic_AI_Studio_Hut_v2.1.7_GLOBAL_BACKGROUND-debug.apk.sha256

      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: Demonic-AI-Studio-Hut-v2.1.7-GLOBAL-BACKGROUND-debug
          path: |
            Demonic_AI_Studio_Hut_v2.1.7_GLOBAL_BACKGROUND-debug.apk
            Demonic_AI_Studio_Hut_v2.1.7_GLOBAL_BACKGROUND-debug.apk.sha256
          if-no-files-found: error

      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi

      - name: Android install and launch runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh .github/scripts/android_smoke_test.sh

      - name: Capture QA diagnostics
        if: always()
        timeout-minutes: 1
        run: |
          timeout 10 adb devices -l > adb-devices.txt 2>/dev/null || true
          timeout 10 adb logcat -d > logcat-final.txt 2>/dev/null || true
          timeout 10 adb shell dumpsys package com.flymaccin.pocketpotna > package-final.txt 2>/dev/null || true
          test -f emulator-smoke-report.txt || echo 'Runtime smoke test did not reach app launch.' > emulator-smoke-report.txt

      - name: Upload emulator QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Demonic-AI-Studio-Hut-v2.1.7-GLOBAL-BACKGROUND-emulator-QA
          path: |
            emulator-smoke-report.txt
            adb-devices.txt
            logcat.txt
            logcat-final.txt
            package-final.txt
            fatal-app.txt
          if-no-files-found: warn
