name: FME Everything Runtime Smoke
on:
  push:
    branches: [ build/fme-everything-one-apk-v1 ]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build one APK
        working-directory: android/lootchee-rom-emulator
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Runtime install launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            APK=android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk
            adb install -r "$APK"
            adb shell am force-stop com.flymaccin.lootcheerom
            adb shell am start -W -n com.flymaccin.lootcheerom/.MainActivity | tee /tmp/launch.txt
            sleep 8
            PID=$(adb shell pidof com.flymaccin.lootcheerom | tr -d '\r')
            test -n "$PID"
            adb shell dumpsys activity activities | grep -q 'com.flymaccin.lootcheerom/.MainActivity'
            ! adb logcat -d -t 500 | grep -E 'FATAL EXCEPTION.*com.flymaccin.lootcheerom|Process: com.flymaccin.lootcheerom.*FATAL'
            adb exec-out screencap -p > /tmp/fme-home.png
            echo "FME_RUNTIME_INSTALL_LAUNCH=PASS" | tee /tmp/runtime.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FME-EVERYTHING-RUNTIME-PROOF
          path: |
            /tmp/fme-home.png
            /tmp/launch.txt
            /tmp/runtime.txt
            android/lootchee-rom-emulator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
