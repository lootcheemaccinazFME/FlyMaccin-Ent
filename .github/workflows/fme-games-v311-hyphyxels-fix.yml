name: FME Games v3.1.1 HY-PHYXELS Fix
on:
  push:
    branches: [dev/fme-games-v3.1.1-hyphyxels-fix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hyphyxels-fix:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Fetch exact v3.1.1 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fme-v311 && mkdir -p /tmp/fme-v311
          curl -fL --retry 3 'https://pocket-potna-remote.floot.app/_cdn/static/174709f2-c871-4dc9-b0f9-fc261560ba4a-FME_GAMES_PAK_STUDIO_v3.1.1_HYPHYXELS_FIX_SOURCE.zip' -o /tmp/fme-v311/source.zip
          echo '841584d4ff5b501492651d4a29ccd23cb1f0fad43b9c0c6b7d71c68b75f31246  /tmp/fme-v311/source.zip' | sha256sum -c -
          unzip -q /tmp/fme-v311/source.zip -d /tmp/fme-v311/src
          APP_DIR=/tmp/fme-v311/src/FME_GAMES_PAK_STUDIO_v3.1.1_HYPHYXELS_FIX_SOURCE
          HYPHY="$APP_DIR/gamewrapper/src/hyphyxelsArcade/assets/game/index.html"
          HUBHYPHY="$APP_DIR/hub/src/main/assets/hyphyxels_arcade_invasion.html"
          test -f "$HYPHY"
          test -f "$HUBHYPHY"
          test -f "$APP_DIR/gamewrapper/src/hyphyxelsArcade/assets/game/assets/loon3y-haha-idle.png"
          test -f "$APP_DIR/gamewrapper/src/hyphyxelsArcade/assets/game/assets/loon3y-haha-attack.png"
          echo '63aff8ef41713a1446e41cef54e566b0f1a5939145659619bd4593247816528b  '"$APP_DIR"'/gamewrapper/src/hyphyxelsArcade/assets/game/assets/loon3y-haha-idle.png' | sha256sum -c -
          echo 'f1e60ea4b848e3b6dda5b65314a8df890488638f9de7b9831a77c3de69649150  '"$APP_DIR"'/gamewrapper/src/hyphyxelsArcade/assets/game/assets/loon3y-haha-attack.png' | sha256sum -c -
          grep -q 'LOON3Y HAHA' "$HYPHY"
          grep -q 'id="aimStick"' "$HYPHY"
          grep -q 'vx:dx\*9.5' "$HYPHY"
          ! grep -q 'vx:0,vy:-8' "$HYPHY"
          grep -q 'LOON3Y HAHA' "$HUBHYPHY"
          grep -q 'id="aimStick"' "$HUBHYPHY"
          grep -q 'vx:dx\*9.5' "$HUBHYPHY"
          ! grep -q 'vx:0,vy:-8' "$HUBHYPHY"
          grep -q 'versionCode = 311' "$APP_DIR/hub/build.gradle.kts"
          grep -q '3.1.1-hyphyxels-hotfix' "$APP_DIR/hub/build.gradle.kts"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          chmod +x "$APP_DIR/gradlew" "$APP_DIR/tools/package_game_apks.py"
      - name: Create QA signer
        shell: bash
        run: |
          set -euo pipefail
          PASS=$(openssl rand -hex 18)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore /tmp/fme-games-v311.jks -storepass "$PASS" -keypass "$PASS" -alias fmev311 -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=FME Games v3.1.1 QA, O=FlyMaccin Ent, OU=Game QA, C=US' >/dev/null 2>&1
          echo "FME_KEYSTORE_PATH=/tmp/fme-games-v311.jks" >> "$GITHUB_ENV"
          echo "FME_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "FME_KEY_ALIAS=fmev311" >> "$GITHUB_ENV"
          echo "FME_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Build all children and repack hub
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          ./gradlew --no-daemon :gamewrapper:assembleRelease
          python3 tools/package_game_apks.py
          test "$(find hub/src/main/assets/game_apks -maxdepth 1 -name '*.apk' | wc -l)" -eq 25
      - name: Lint corrected HY-PHYXELS and hub
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          ./gradlew --no-daemon :gamewrapper:lintHyphyxelsArcadeRelease :hub:lintRelease
      - name: Build corrected hub and collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          ./gradlew --no-daemon :hub:assembleRelease :hub:bundleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          CHILD=$(find gamewrapper/build/outputs/apk/hyphyxelsArcade/release -name '*.apk' | head -1)
          HUBAPK=$(find hub/build/outputs/apk/release -name '*.apk' | head -1)
          HUBAAB=$(find hub/build/outputs/bundle/release -name '*.aab' | head -1)
          cp "$CHILD" "$GITHUB_WORKSPACE/out/HY_PHYXELS_Arcade_Invasion_v1.1.1-character-aim-hotfix.apk"
          cp "$HUBAPK" "$GITHUB_WORKSPACE/out/FME_GAMES_v3.1.1_HYPHYXELS_FIX.apk"
          cp "$HUBAAB" "$GITHUB_WORKSPACE/out/FME_GAMES_v3.1.1_HYPHYXELS_FIX.aab"
          cp HYPHYXELS_v3.1.1_FIX_REPORT.md "$GITHUB_WORKSPACE/out/"
          cp /tmp/fme-v311/source.zip "$GITHUB_WORKSPACE/out/FME_GAMES_PAK_STUDIO_v3.1.1_HYPHYXELS_FIX_SOURCE.zip"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$GITHUB_WORKSPACE/out/HY_PHYXELS_Arcade_Invasion_v1.1.1-character-aim-hotfix.apk" > "$GITHUB_WORKSPACE/out/HYPHYXELS_SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$GITHUB_WORKSPACE/out/HY_PHYXELS_Arcade_Invasion_v1.1.1-character-aim-hotfix.apk" > "$GITHUB_WORKSPACE/out/HYPHYXELS_BADGING.txt"
          grep -q "package: name='com.flymaccin.hyphyxels' versionCode='311'" "$GITHUB_WORKSPACE/out/HYPHYXELS_BADGING.txt"
      - name: Prepare Android 36 emulator
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "emulator" "system-images;android-36;google_apis;x86_64"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          AVDPATH="$ANDROID_AVD_HOME/FME_HYPHYXELS_311.avd"
          rm -rf "$AVDPATH" "$ANDROID_AVD_HOME/FME_HYPHYXELS_311.ini"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n FME_HYPHYXELS_311 -k 'system-images;android-36;google_apis;x86_64' -p "$AVDPATH" --force
          cat > "$ANDROID_AVD_HOME/FME_HYPHYXELS_311.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVDPATH
          path.rel=avd/FME_HYPHYXELS_311.avd
          target=android-36
          EOF
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
      - name: Android 36 install and launch corrected HY-PHYXELS
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          ACCEL='-accel off'; if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then ACCEL='-accel on'; fi
          nohup emulator -avd FME_HYPHYXELS_311 -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect $ACCEL > /tmp/fme-hyphyxels-311-emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          READY=0; for i in $(seq 1 120); do BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r'); if [ "$BOOT" = '1' ]; then READY=1; break; fi; sleep 2; done
          test "$READY" = '1'
          mkdir -p "$GITHUB_WORKSPACE/out/runtime"
          APK="$GITHUB_WORKSPACE/out/HY_PHYXELS_Arcade_Invasion_v1.1.1-character-aim-hotfix.apk"
          adb install -r "$APK" > "$GITHUB_WORKSPACE/out/runtime/install.txt" 2>&1
          COMP=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.flymaccin.hyphyxels | tr -d '\r' | tail -1)
          test -n "$COMP"
          adb logcat -c
          adb shell am start -W -n "$COMP" > "$GITHUB_WORKSPACE/out/runtime/launch.txt" 2>&1
          sleep 8
          PID=$(adb shell pidof com.flymaccin.hyphyxels | tr -d '\r')
          test -n "$PID"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/out/runtime/HYPHYXELS_v311.png"
          adb logcat -d > "$GITHUB_WORKSPACE/out/runtime/logcat.txt"
          ! grep -q -E 'FATAL EXCEPTION|AndroidRuntime.*FATAL' "$GITHUB_WORKSPACE/out/runtime/logcat.txt"
          echo "HY-PHYXELS v3.1.1 PASS pid=$PID component=$COMP" > "$GITHUB_WORKSPACE/out/runtime/results.txt"
          cp /tmp/fme-hyphyxels-311-emulator.log "$GITHUB_WORKSPACE/out/runtime/EMULATOR_HOST.log"
      - name: Checksums
        if: always()
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/out"
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS.txt
      - name: Upload v3.1.1 hotfix package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FME-Games-v3.1.1-HY-PHYXELS-Hotfix
          path: out/*
          if-no-files-found: error
          retention-days: 30
